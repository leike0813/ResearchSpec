    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_financial_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,event_timeline,duplicate_decisions,assessments,ranking,conclusions
