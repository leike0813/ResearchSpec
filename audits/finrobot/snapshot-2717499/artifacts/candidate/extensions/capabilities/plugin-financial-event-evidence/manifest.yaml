title: Financial Event And Catalyst Research
description: Prepare, deduplicate, assess, and rank financial events and
  catalysts with explicit provenance, probability, sentiment, impact, horizon,
  and confidence.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
