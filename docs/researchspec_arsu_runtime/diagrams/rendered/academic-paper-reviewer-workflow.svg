,756.3047" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="256" x2="607" y1="756.3047" y2="756.3047"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="79" x="263" y="751.2388">submit Gate</text><polygon fill="#A80036" points="966.5,781.4375,976.5,785.4375,966.5,789.4375,970.5,785.4375" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="613" x2="972.5" y1="785.4375" y2="785.4375"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="138" x="620" y="780.3716">Gate receipt + ledger</text><polygon fill="#A80036" points="601,817.5703,611,821.5703,601,825.5703,605,821.5703" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="256" x2="607" y1="821.5703" y2="821.5703"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="333" x="263" y="816.5044">Advance transition:&lt;instance&gt;/&lt;completion-node&gt;</text><polygon fill="#A80036" points="966.5,846.7031,976.5,850.7031,966.5,854.7031,970.5,850.7031" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="613" x2="972.5" y1="850.7031" y2="850.7031"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="160" x="620" y="845.6372">transition receipt + state</text><!--MD5=[b3ec3226fc2f6a820383523028e36363]
@startuml
title Strict compatibility：Academic Paper Reviewer 外层 work graph
skinparam shadowing false
actor User
participant "Host Agent" as Agent
participant "ResearchSpec CLI" as CLI
participant "academic-paper-reviewer\n7-agent team" as Reviewer
database "Workspace" as Files

Agent -> CLI : status + route instructions
CLI - -> Agent : one of 6 routes, registered manuscript,
CLI - -> Agent : output DAG and Gate policy
Agent -> User : route and read-only boundary
User - -> Agent : confirm route
Agent -> CLI : Start
CLI -> Files : receipt then subflow state

loop each declared review artifact
  Agent -> CLI : scoped work instructions
  CLI - -> Agent : manuscript/evidence reads + output path
  Agent -> Reviewer : perform bounded review
  note over Reviewer
    Internal full route:
    field analysis -> independent five-person panel
    -> editorial synthesis and roadmap.
    Panel parallelism is semantic, not CLI work parallelism.
  end note
  Reviewer -> Files : separate review candidate
  note right of Files : Manuscript is never rewritten.
  Agent -> CLI : hash-bound Submit
  CLI -> Files : submit receipt + registry
end

opt required route Gate
  Agent -> User : Verify review-quality verdict
  User - -> Agent : confirm Gate
  Agent -> CLI : submit Gate
  CLI -> Files : Gate receipt + ledger
end
Agent -> CLI : Advance transition:<instance>/<completion-node>
CLI -> Files : transition receipt + state
@enduml

