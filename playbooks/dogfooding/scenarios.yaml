    prompts: [按场景步骤尝试错误实例 selector、精确重试和不同 provenance 的重复提交；不要修 state。]
    checkpoints: [保存两个实例 frontier、每次操作 payload、receipt 与失败前后状态。]
    prohibited_actions: [跨实例复用 receipt, 伪造 selector, 重复推进已完成 transition]
    hard_assertions: [错误或语义不同的操作被拒绝，精确重试不产生重复权威记录。]
