    prompts: [我不接受 override，也不选择其他分支。保留当前失败结论并告诉我阻塞状态和可选的后续补救。]
    checkpoints: [保存拒绝前后 Gate、Decision ledger 和 frontier。]
    prohibited_actions: [把拒绝转成 override, 隐式选择 transition, 覆盖失败 event]
    hard_assertions: [没有 override Decision，failed Gate 与 downstream blocker 保持不变。]
    required_evidence: [manifest, prompts, transcript, gate-events, before-after-status, decision-ledger, remediation-explanation]
