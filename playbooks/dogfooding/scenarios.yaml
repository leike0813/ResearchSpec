schema_version: "1"
canonical_playbook: README.md
adapters:
  - adapters/codex.md
soft_rubric: README.md#7-评分与结论

suites:
  natural-18:
    - DF-T1-STANDALONE
    - DF-T1-RESUME
    - DF-T1-NAT-LITERATURE
    - DF-T1-NAT-WRITING
    - DF-T1-NAT-EVIDENCE
    - DF-T1-NAT-REVIEW
    - DF-T1-NOTE-RESUME
    - DF-T2-NOTE-DIVERGENCE
    - DF-T2-NOTE-MATERIAL-CHANGE
    - DF-T2-NOTE-AMBIGUITY
    - DF-T2-RUN-PRECEDENCE
    - DF-T2-COMPLETED-RUN
    - DF-T2-FIRST-SEARCH-MISS
    - DF-T2-SECOND-SEARCH-MISS
    - DF-T2-TWO-CAPABILITIES
    - DF-T2-MISSING-INPUT
    - DF-T2-UNRELATED
    - DF-T2-DECLINE-FRAMEWORK

fixture_variants:
  - fixture_variant: goal-only
    paths:
      - benchmark/README.md
      - benchmark/goal.md
  - fixture_variant: evidence-corpus
    paths:
      - benchmark/README.md
      - benchmark/goal.md
      - benchmark/sources.yaml
  - fixture_variant: partial-manuscript
    paths:
      - benchmark/README.md
      - benchmark/goal.md
      - benchmark/sources.yaml
      - benchmark/claims.yaml
      - benchmark/partial-manuscript.md
  - fixture_variant: review-cycle
    paths:
      - benchmark/README.md
      - benchmark/goal.md
      - benchmark/sources.yaml
      - benchmark/claims.yaml
      - benchmark/partial-manuscript.md
      - benchmark/review-comments.md
      - benchmark/revision-context.md
  - fixture_variant: fault-injection
    paths:
      - benchmark/README.md
      - benchmark/goal.md
      - benchmark/sources.yaml
      - benchmark/claims.yaml
      - benchmark/partial-manuscript.md
      - benchmark/review-comments.md
      - benchmark/revision-context.md
      - benchmark/variants/stale-manuscript.md
      - benchmark/variants/conflicting-review.md
  - fixture_variant: ordinary-continuation
    paths:
      - benchmark/README.md
      - benchmark/goal.md
      - benchmark/sources.yaml
      - benchmark/partial-manuscript.md
      - benchmark/ordinary-task-note.md
  - fixture_variant: ambiguous-continuation
    paths:
      - benchmark/README.md
      - benchmark/goal.md
      - benchmark/sources.yaml
      - benchmark/partial-manuscript.md
      - benchmark/review-comments.md
      - benchmark/ordinary-task-note.md
      - benchmark/second-task-note.md

release_mappings:
  - checklist_ref: quick-standalone
    scenario_id: DF-T1-STANDALONE
  - checklist_ref: new-session-resume
    scenario_id: DF-T1-RESUME
  - checklist_ref: context-export
    scenario_id: DF-T1-EXPORT
  - checklist_ref: gate-challenge-override
    scenario_id: DF-T1-GATE
  - checklist_ref: end-to-end-pipeline
    scenario_id: DF-T1-PIPELINE
  - checklist_ref: natural-literature
    scenario_id: DF-T1-NAT-LITERATURE
  - checklist_ref: natural-writing
    scenario_id: DF-T1-NAT-WRITING
  - checklist_ref: natural-evidence
    scenario_id: DF-T1-NAT-EVIDENCE
  - checklist_ref: natural-review
    scenario_id: DF-T1-NAT-REVIEW
  - checklist_ref: ordinary-note-resume
    scenario_id: DF-T1-NOTE-RESUME

scenarios:
  - scenario_id: DF-T0-BOOTSTRAP
    tier: 0
    title: 隔离环境中的首次初始化与 Skill 发现
    intent: 验证 init 只准备 schema 2 workspace，并按选定工具、Adapter 和 registry 投影 Skill surface。
    personas: [first-time-maintainer]
    route_refs: []
    fixture_variant: goal-only
    initial_state: empty-disposable-project
    prompts:
      - 初始化这个项目，但不要开始研究。完成后说明 workspace 状态和可用研究能力。
    checkpoints:
      - 保存 init 前后目录树、status、check、CLI help 和 Skill inventory。
      - 确认四份 stable specs、preset profiles 和空 runs 目录存在。
    prohibited_actions:
      - 在 init 中选择或启动 ARSU route。
      - 写入未隔离的 Agent 全局目录或联系 Zotero。
    hard_assertions:
      - 基础可见 Skill 仅有 researchspec-navigate；其他能力在隐藏 Procedure 目录中，选定 Adapter Skills 与十六个顶层命令可发现。
      - 没有 run 被创建，check all --strict 通过。
    required_evidence: [manifest, prompts, transcript, workspace-tree, final-status, final-check, skill-inventory, cli-help]
    soft_rubric: default
    cleanup: [保留 Tier 1 所需 workspace，或只删除已确认属于本轮的隔离目录。]
    acceptance_journey_refs: [bootstrap]

  - scenario_id: DF-T0-UPDATE-DRIFT
    tier: 0
    title: 重复 init、update 与静态投影 drift 保护
    intent: 验证维护操作不启动工作，不覆盖无法确认所有权的本地修改。
    personas: [maintainer-upgrading-workspace]
    route_refs: []
    fixture_variant: goal-only
    initial_state: initialized-workspace-with-one-drifted-generated-projection
    prompts:
      - 检查并更新 ResearchSpec 安装；保留不能确认所有权的修改，也不要开始研究。
    checkpoints:
      - 保存 drift 文件、manifest、dry-run 和实际 update 结果。
      - 再次确认没有 active run，stable specs 未变化。
    prohibited_actions: [使用 --force 掩盖未知所有权, 修改 stable specs, 把 update 解释为启动路线]
    hard_assertions:
      - Drift 文件保持不变，clean manifest-owned projections 可以更新。
      - 重复操作不创建 run、node、Gate、Decision 或 handoff。
    required_evidence: [manifest, prompts, transcript, before-after-hashes, dry-run, update-result, final-status, final-check]
    soft_rubric: default
    cleanup: [恢复或删除隔离 workspace，不回滚仓库文件。]
    acceptance_journey_refs: [bootstrap]

  - scenario_id: DF-T1-STANDALONE
    tier: 1
    title: 自然请求按需执行独立 Procedure
    intent: 验证 Navigate 从普通研究请求发现并执行独立 Procedure，交付普通项目文件且不创建图状态。
    personas: [researcher-with-vague-goal]
    route_refs: []
    fixture_variant: evidence-corpus
    initial_state: initialized-not-started-workspace
    prompts:
      - 请根据项目里提供的资料，简要整理生成式 AI 对高校写作教学可能产生的影响，并把可核对的结论写成文件。
    checkpoints:
      - 保存普通请求、目录检索与所选 Procedure 的指引。
      - 保存普通项目交付物和工作前后的 status、runs 目录及 handoff 状态。
    prohibited_actions: [要求用户先说出 Procedure 名称, 创建 run 或 handoff, 把输出写入 researchspec, 手改 authority 文件]
    hard_assertions:
      - Navigate 自主发现并执行适合的独立 Procedure，不要求用户提供内部名称。
      - 交付物是 researchspec 外的普通项目文件；没有创建 run、node、Gate、Decision 或 handoff。
      - 结果说明产物路径、证据及限制、未解决事项和下一步，不宣称图动作完成。
    required_evidence: [manifest, prompts, transcript, procedure-discovery, instructions, before-after-status, external-files, final-check]
    soft_rubric: default
    cleanup: [保留普通交付物供核对，并把证据复制到 workspace 外。]
    release_checklist_ref: quick-standalone
    acceptance_journey_refs: [routing]

  - scenario_id: DF-T1-RESUME
    tier: 1
    title: 无聊天记忆的新会话恢复图内工作
    intent: 验证 Agent 仅依据 status、精确 selector、run/graph/node 文件及 handoff 恢复已确认的图运行，不创建重复 run。
    personas: [returning-researcher]
    route_refs: [academic-pipeline:end-to-end]
    fixture_variant: review-cycle
    initial_state: staged-unfinished-confirmed-pipeline-run
    prompts:
      - 恢复这个研究项目。不要使用上一段聊天；只根据 workspace 告诉我已完成、阻塞与下一步。
    checkpoints:
      - 完全退出旧 Agent 会话，再从相同项目启动无聊天记忆的新会话。
      - 比较退出前后的 run/node IDs、authority 文件、handoff 和 frontier。
    prohibited_actions: [粘贴旧聊天摘要, 根据目录名猜实例, 重建同一 active run]
    hard_assertions:
      - 恢复结论区分文件事实、推断和未知。
      - Selector 绑定原 machine instance ID，恢复不创建新实例。
    required_evidence: [manifest, fresh-session-proof, prompts, transcript, before-status, resumed-status, instructions, run, graph, nodes, handoff, final-check]
    soft_rubric: default
    cleanup: [保留 workspace 给后续 Tier 1 场景或按 adapter 安全清理。]
    release_checklist_ref: new-session-resume
    acceptance_journey_refs: [resume-pack-failure]

  - scenario_id: DF-T1-EXPORT
    tier: 1
    title: Handoff 与有界 context pack
    intent: 验证 handoff 记录外部路径，而 pack 只包含选定的 ResearchSpec run/node authority 上下文。
    personas: [researcher-handing-off-work]
    route_refs: []
    fixture_variant: partial-manuscript
    initial_state: initialized-workspace-with-active-run-and-external-output
    prompts:
      - 说明 handoff 与 pack 的差异。先展示 pack 的 scope 和排除边界，确认输出路径后生成。
    checkpoints:
      - 保存 handoff 修改前后内容与相关 run/node authority hash。
      - 检查 pack entries 只含选定的 ResearchSpec authority，并排除所有 handoff 指向的外部文件。
    prohibited_actions: [通过 handoff 或 pack 推进 workflow, 把外部 working material 打入 pack, 把外部交付物字节打入 pack]
    hard_assertions:
      - Handoff 只记录角色、路径、用途和限制，不改变 run/node authority。
      - Pack 保持有界且不会覆盖既有输出。
    required_evidence: [manifest, prompts, transcript, handoff-before-after, authority-hashes, pack-command, pack-entries, final-status]
    soft_rubric: default
    cleanup: [保留已确认的 handoff，删除一次性 pack 副本。]
    release_checklist_ref: context-export
    acceptance_journey_refs: [resume-pack-failure]

  - scenario_id: DF-T1-GATE
    tier: 1
    title: Gate challenge、reverification 与显式 override
    intent: 验证失败 Gate 保持阻塞，challenge 追加 attempt，override 写入同一 owning node instance。
    personas: [researcher-challenging-verdict]
    route_refs: [deep-research:full]
    fixture_variant: evidence-corpus
    initial_state: blocking-formal-gate-ready
    prompts:
      - 我对 Gate 结论提出 challenge。展示原 attempt 与证据，重新验证；不要覆盖旧 attempt。若仍失败，停下来让我决定。
      - 我理解风险并 override 最新失败结论；理由是“仅继续探索，不将结论视为已验证”。
    checkpoints:
      - 保存原 attempt、reverification、相关 handoff evidence 和确认者。
      - Override 前确认 Gate 仍阻塞，并核对 Decision ID 与理由。
    prohibited_actions: [覆盖旧 attempt, challenge 后直接改为 pass, 未经用户确认 override, override 后删除 fail]
    hard_assertions:
      - Reverification 追加新 attempt，旧 attempt 保留。
      - Override 位于同一 Gate owning node instance，advance 仍是独立动作。
    required_evidence: [manifest, prompts, transcript, gate-instructions, authority-before-after, handoff-evidence, blocked-status, override, advanced-status]
    soft_rubric: default
    cleanup: [保存 owning run/node 快照，不手工恢复状态。]
    release_checklist_ref: gate-challenge-override
    acceptance_journey_refs: [gate-override]

  - scenario_id: DF-T1-PIPELINE
    tier: 1
    title: 两轮 revision 的完整 pipeline
    intent: 验证 project profile、根 run 授权的 child、正式 Gates、Decision、branch 和动态 revision rounds；并在 reviewer child 中验证 profile 声明的 parallel/join。
    personas: [researcher-requesting-full-paper-workflow]
    route_refs: [academic-pipeline:end-to-end]
    fixture_variant: goal-only
    initial_state: initialized-not-started-workspace
    prompts:
      - 展示 academic-pipeline:end-to-end 的完整 child graph、Gates、分支、边界输出和成本；我确认前不要启动。
      - 我确认根 run。按当前 frontier 启动 graph 授权的 child 和 revision round，不再逐个确认 run；遇到 formal Gate 或 Decision 停下让我确认。先完成两轮 revision，再选择接受路径。
    checkpoints:
      - 保存根确认后尚无 child 的状态，以及随后暴露的 pending child starts 和 parent bindings。
      - 保存 reviewer child 的 parallel/join、Gate、Decision、round 1 和 round 2 的 run/node authority 与 handoffs。
      - 保存 final-integrity、root terminal status 和 check all。
    prohibited_actions: [硬编码 stage 顺序, frontier 暴露前创建 child, 把根授权扩展到 graph 外, revision round 串线, 绕过 final-integrity Gate]
    hard_assertions:
      - 根 run、child runs 和两轮 revision 拥有不同 run ID，并通过 frozen graph、parent binding 与 handoff 衔接。
      - Child 完成只满足所属 graph 条件；Gate、Decision 和 final-integrity Gate 仍需按 frontier 处理，之后根 run 才能进入 terminal state。
    required_evidence: [manifest, prompts, transcript, route-summary, profile, status-sequence, run-snapshots, graph-snapshot, node-snapshots, handoffs, gate-attempts, decisions, round-identities, final-check]
    soft_rubric: default
    cleanup: [归档完整证据目录后按 adapter 安全清理隔离 workspace。]
    release_checklist_ref: end-to-end-pipeline
    acceptance_journey_refs: [pipeline-confirmation, revision-rounds]

  - scenario_id: DF-T1-NAT-LITERATURE
    tier: 1
    title: 自然语言文献综合
    intent: 验证首次会话从中文研究请求主动发现文献综合能力，依据给定合成来源形成有边界的普通文件。
    personas: [first-time-researcher]
    route_refs: []
    fixture_variant: evidence-corpus
    initial_state: fresh-initialized-workspace
    prompts: [请把项目里关于生成式 AI 与高校写作教学的资料整理成一份简短综述，指出各项结论有什么依据、哪里还不确定。]
    checkpoints: [保存原始请求、能力发现轨迹、所读来源、交付物及最终说明。]
    prohibited_actions: [要求用户先说出能力名称, 把合成来源当成已核实出版物, 把普通综述称为已完成 Gate]
    hard_assertions:
      - Agent 从普通请求发现并执行适用能力，交付 researchspec 外的综述文件。
      - 结果列出产物路径、来源依据及限制、未解决问题和下一步；不捏造外部文献。
    required_evidence: [manifest, prompts, transcript, tool-trace, source-reads, external-files, final-status]
    soft_rubric: default
    cleanup: [保存证据后按适配器清理隔离项目。]
    release_checklist_ref: natural-literature
    acceptance_journey_refs: [routing]

  - scenario_id: DF-T1-NAT-WRITING
    tier: 1
    title: Natural manuscript revision
    intent: Verify that an English request to improve draft prose reaches a suitable writing capability and yields an ordinary revised manuscript with source limits disclosed.
    personas: [researcher-with-draft]
    route_refs: []
    fixture_variant: partial-manuscript
    initial_state: fresh-initialized-workspace
    prompts: [Please revise the draft discussion using the supplied source summaries. Keep unsupported claims visible and save the revised text in a separate file.]
    checkpoints: [Save the original request, discovery trace, source reads, revised file and final report.]
    prohibited_actions: [Require an internal capability name, overwrite the fixture draft, invent citations]
    hard_assertions:
      - The Agent invokes an applicable writing capability and saves a separate ordinary manuscript file outside researchspec.
      - The report identifies the output path, source limits, unresolved claims and next step.
    required_evidence: [manifest, prompts, transcript, tool-trace, source-reads, external-files, final-status]
    soft_rubric: default
    cleanup: [Preserve the recording, then clean only the isolated project.]
    release_checklist_ref: natural-writing
    acceptance_journey_refs: [routing]

  - scenario_id: DF-T1-NAT-EVIDENCE
    tier: 1
    title: 自然请求核查论断
    intent: 验证 Agent 从普通核查请求找到证据核查能力，逐条区分材料支持、推断与缺口。
    personas: [researcher-checking-claims]
    route_refs: []
    fixture_variant: partial-manuscript
    initial_state: fresh-initialized-workspace
    prompts: [请检查草稿中的主要论断能否由项目提供的资料支持，把核查结果和仍需补证的地方写成文件。]
    checkpoints: [保存论断、来源读取轨迹、核查文件和最终说明。]
    prohibited_actions: [把合成文献说成真实核实文献, 把独立核查报告称为正式 Gate 结论]
    hard_assertions:
      - Agent 主动找到适用核查能力，并将逐条核查结果写入 researchspec 外的普通文件。
      - 结果区别证据与推断，报告路径、证据限制、未解决论断和下一步。
    required_evidence: [manifest, prompts, transcript, tool-trace, source-reads, external-files, final-status]
    soft_rubric: default
    cleanup: [保存证据后按适配器清理隔离项目。]
    release_checklist_ref: natural-evidence
    acceptance_journey_refs: [routing]

  - scenario_id: DF-T1-NAT-REVIEW
    tier: 1
    title: 自然请求处理审稿意见
    intent: 验证 Agent 从普通审稿回复请求主动选择审稿或回复能力，按意见与稿件证据形成回复草稿。
    personas: [author-responding-to-review]
    route_refs: []
    fixture_variant: review-cycle
    initial_state: fresh-initialized-workspace
    prompts: [请阅读审稿意见和现有稿件，逐条说明哪些意见需要修改，并起草给审稿人的回复。]
    checkpoints: [保存意见与稿件读取轨迹、回复草稿和最终说明。]
    prohibited_actions: [要求用户先给出流程名称, 虚构已完成的稿件修改, 把普通回复当成正式 Decision]
    hard_assertions:
      - Agent 主动找到适用能力，在 researchspec 外形成逐条回复文件。
      - 回复区分已做修改与拟议修改；结果报告依据、限制、未解决事项和下一步。
    required_evidence: [manifest, prompts, transcript, tool-trace, source-reads, external-files, final-status]
    soft_rubric: default
    cleanup: [保存证据后按适配器清理隔离项目。]
    release_checklist_ref: natural-review
    acceptance_journey_refs: [routing]

  - scenario_id: DF-T1-NOTE-RESUME
    tier: 1
    title: 普通研究任务跨会话继续
    intent: 验证无旧聊天的新会话对照当前材料与普通笔记恢复独立任务，不创建或声称任何图状态。
    personas: [returning-researcher]
    route_refs: []
    fixture_variant: ordinary-continuation
    initial_state: staged-ordinary-note-and-current-materials-without-run
    prompts: [继续上次没有做完的资料核查，并告诉我你是根据哪些现有文件判断下一步的。]
    checkpoints:
      - 将 fixture 笔记复制为 work/researchspec-notes/writing-evidence.md，退出旧会话后启动无旧聊天的新会话。
      - 保存笔记与当前材料、输出的对照记录及工作前后 status。
    prohibited_actions: [依赖旧聊天摘要, 根据笔记修改时间选择任务, 把笔记当作 run 或 selector]
    hard_assertions:
      - Agent 对照普通笔记、当前来源和稿件恢复下一步，报告证据限制并继续。
      - 没有创建 run、node、Gate、Decision 或 handoff；笔记不授予工作流权限。
    required_evidence: [manifest, fresh-session-proof, prompts, transcript, task-note, material-check, before-after-status, external-files]
    soft_rubric: default
    cleanup: [保存笔记及对照证据后清理隔离项目。]
    release_checklist_ref: ordinary-note-resume
    acceptance_journey_refs: [resume-pack-failure]

  - scenario_id: DF-T2-NOTE-DIVERGENCE
    tier: 2
    title: 笔记与材料轻微差异
    intent: 验证来源文件出现不改变任务身份、输入或下一步的差异时，Agent 报告差异并继续，不索取多余确认。
    personas: [returning-researcher]
    route_refs: []
    fixture_variant: ordinary-continuation
    initial_state: staged-note-with-nonmaterial-source-edit
    prompts: [接着完成前次的资料核查。]
    checkpoints: [将普通笔记放入 work/researchspec-notes，记录来源文件中不影响任务的一处编辑及前后状态。]
    prohibited_actions: [忽略材料差异, 因非实质差异停止并请求确认, 按笔记修改时间选择任务]
    hard_assertions:
      - Agent 对照笔记与现有材料，报告差异，确认任务身份、所需输入和下一步未变后继续。
      - 未创建图状态，也未把笔记中的已完成工作当作 CLI 确认的完成状态。
    required_evidence: [manifest, prompts, transcript, task-note, material-diff, before-after-status]
    soft_rubric: default
    cleanup: [保存差异证据后清理隔离项目。]
    acceptance_journey_refs: [resume-pack-failure]

  - scenario_id: DF-T2-NOTE-MATERIAL-CHANGE
    tier: 2
    title: 必需材料变化阻断普通任务恢复
    intent: 验证笔记记录的必需来源已缺失且现有材料无法确定替代输入时，Agent 只问一个关于受影响材料的问题。
    personas: [returning-researcher]
    route_refs: []
