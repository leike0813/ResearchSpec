    acceptance_journey_refs: []

  - scenario_id: DF-T3-GATE-REFUSAL
    tier: 3
    title: failed Gate 后拒绝 override
    intent: 验证 postpone 或拒绝 override 不会隐式选择其他 transition，Gate 持续阻塞。
