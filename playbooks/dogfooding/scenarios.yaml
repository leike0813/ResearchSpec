    checkpoints: [按非法变体保存 error code、candidate bytes/hash 与 authority hashes。]
    prohibited_actions: [为通过校验修改 instructions, 登记 workspace 外路径, 把非法输入替换成未记录内容]
    hard_assertions: [所有非法 candidate 均被结构化拒绝且无 receipt 或 artifact registration。]
    required_evidence: [manifest, prompts, transcript, invalid-case-matrix, errors, candidate-hashes, authority-hashes, final-check]
    soft_rubric: default
    cleanup: [删除只属于本轮的非法临时 candidate。]
    acceptance_journey_refs: []

  - scenario_id: DF-T3-SELECTOR-IDEMPOTENCY
    tier: 3
    title: 错误 selector、重复提交与跨实例串线
    intent: 验证 selector 必须绑定当前实例，精确重试可恢复，语义不同的重复操作被拒绝。
    personas: [fault-injection-maintainer]
    route_refs: [academic-pipeline:end-to-end]
    fixture_variant: review-cycle
