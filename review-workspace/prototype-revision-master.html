    function strategyView(){
      const item=a(state.atom),s=item.strategy,isActive=item.id===activeAtom,locked=!s.draft;
      return '<section class="panel"><div class="panel-head"><div><h2>'+esc(item.short)+' · '+esc(item.summary)+'</h2><p class="muted">来自 '+esc(linkedThreads(item.id).map(label).join("、"))+' · 修改位置 '+esc(item.locations.map(id=>m(id).locator).join("、"))+'</p></div><span class="tag '+(isActive?"warn":"neutral")+'">'+(isActive?"本次审阅":"可浏览")+'</span></div><div class="focus-note">本次需要确认的是 '+esc(a(activeAtom).short)+' 的策略。其他已生成的策略也可以查看；如需调整先写在右侧。</div><h3 style="margin-top:1.2rem">建议如何回应</h3><p><b>'+esc(s.stance)+'</b></p><p>'+esc(s.why)+'</p>'+(s.blocker==="无"?"":'<div class="blocker"><b>还缺什么</b><p>'+esc(s.blocker)+'</p></div>')+'<h3 style="margin-top:1.2rem">计划修改</h3>'+s.actions.map(action=>'<div class="card"><b>'+esc(action.change)+'</b><p class="small muted">位置：'+esc(action.targets.map(id=>m(id).locator).join("、"))+' · 回复用途：'+esc(action.effect)+'</p></div>').join("")+'<h3>需要核对的材料</h3>'+s.evidence.map(row=>'<div class="card"><b>'+esc(row[0])+'</b> <span class="tag '+(row[1]==="有"?"good":"warn")+'">'+esc(row[1])+'</span><p class="small">'+esc(row[2])+'</p></div>').join("")+'<details><summary>查看待确认问题、补材建议与完成条件</summary><h3>待确认的问题</h3><ul class="list">'+(s.pending.length?s.pending.map(line=>'<li>'+esc(line)+'</li>').join(""):"<li>无待确认事项</li>")+'</ul><h3>补材建议</h3><p>'+esc(s.suggestion)+'</p>'+supplementBacklog()+'<h3>候选修改文字</h3><p>'+(locked?"材料或确认尚未齐全；目前只有修改方向。":esc(s.draft))+'</p><h3>完成条件</h3><ul class="checklist"><li class="done">策略、修改动作和证据判断已形成</li><li class="'+(locked?"":"done")+'">策略已确认</li><li class="'+(locked?"":"done")+'">修改事项与回复草稿已形成</li><li class="'+(locked?"":"done")+'">对应检查通过，阻断已解决</li></ul></details>'+sourceFiles("response-strategy-cards/"+item.id+".md · 09-supplement-suggestion-plan.md · 10-supplement-intake-plan.md")+'</section>';
    }
    function roundAppendix(){
      const outputs=[["修订稿","候选已形成","manuscript/main.tex"],["Markdown 回复信","候选已形成","response/response.md"],["LaTeX 回复信","候选已形成","response/response.tex"],["修订对照稿","可选 · 未生成","—"]];
      return '<details><summary>查看写作要求</summary><ul class="list"><li>结果段报告估计值与区间，不把区间跨零写成“没有作用”。</li><li>摘要和讨论使用关联措辞；回复信保持礼貌、具体，并指向实际修改位置。</li></ul></details><details><summary>查看完整逐条回复（6 条）</summary><div class="table-wrap"><table><thead><tr><th>原始意见</th><th>修改范围</th><th>关键改动</th><th>回复说明</th></tr></thead><tbody>'+THREADS.map(source=>{const row=r(source.id);return '<tr><td><b>'+esc(source.short)+'</b><p class="source-text">'+esc(original(source.id))+'</p></td><td>'+esc(row.scope)+'</td><td class="source-text">'+esc(row.excerpt)+'</td><td class="source-text">'+esc(row.reply)+'</td></tr>';}).join("")+'</tbody></table></div></details><details><summary>查看交付文件状态</summary><div class="table-wrap"><table><thead><tr><th>交付文件</th><th>状态</th><th>位置</th></tr></thead><tbody>'+outputs.map(row=>'<tr><td>'+esc(row[0])+'</td><td>'+esc(row[1])+'</td><td class="mono">'+esc(row[2])+'</td></tr>').join("")+'</tbody></table></div></details><div class="blocker"><b>正式确认仍待处理</b><p class="small">6 项修改和 6 条回复已形成候选。请先核对本轮预览；正式结果回到对话中确认。</p></div>';
    }
    function roundView(){
      const source=t(state.thread),row=r(source.id),related=LOGS.filter(log=>log.threads.includes(source.id)),item=a(state.atom);
      return '<section class="panel"><div class="panel-head"><div><h2>第二轮修改与回复预览</h2><p class="muted">逐条核对稿件改动、审稿意见的回复，以及是否有遗漏。</p></div><span class="tag warn">正式确认待处理</span></div><div class="metric-grid"><div class="metric"><b>6 / 6</b><span>计划修改已完成</span></div><div class="metric"><b>6 / 6</b><span>审稿意见有回复</span></div><div class="metric"><b>3</b><span>修改记录</span></div><div class="metric"><b>2</b><span>已接收补充材料</span></div></div><h3>'+esc(source.short)+' · '+esc(source.summary)+'</h3><div class="response-box"><b>建议回复</b><p class="source-text">'+esc(row.reply)+'</p><b>回复对应的改动</b><p class="source-text">'+esc(row.excerpt)+'</p><p class="small muted">修改范围：'+esc(row.scope)+'</p></div><h3 style="margin-top:1.3rem">稿件改动 · '+esc(item.short)+'</h3><div class="comparison"><div><span class="tag neutral">修改前</span><p>'+esc(m(item.locations[0]).before)+'</p></div><div><span class="tag good">修改后</span><p>'+esc(m(item.locations[0]).after)+'</p></div></div><details><summary>查看六条意见的回复覆盖</summary><div class="table-wrap"><table><thead><tr><th>审稿意见</th><th>关联修订</th><th>修改范围</th><th>状态</th></tr></thead><tbody>'+THREADS.map(th=>{const response=r(th.id);return '<tr class="'+(state.thread===th.id?"selected-row":"")+'"><td>'+button(th.short+" · "+th.summary,"thread",th.id,state.thread===th.id)+'</td><td>'+esc(linkedAtoms(th.id).map(id=>a(id).short).join("、"))+'</td><td>'+esc(response.scope)+'</td><td><span class="tag good">已覆盖</span></td></tr>';}).join("")+'</tbody></table></div></details><details><summary>查看相关修改记录与执行安排</summary>'+related.map(log=>'<div class="card"><b>'+esc(log.id)+' · '+esc(log.summary)+'</b>'+log.entries.map(entry=>'<dl class="kv"><dt>文件与位置</dt><dd>'+esc(entry.file+' · '+entry.locator)+'</dd><dt>改动与理由</dt><dd>'+esc(entry.change+'；'+entry.reason)+'</dd><dt>证据与回复用途</dt><dd>'+esc(entry.evidence+'；'+entry.response)+'</dd></dl>').join("")+'</div>').join("")+'<div class="table-wrap"><table><thead><tr><th>安排</th><th>修订事项</th><th>动作与依赖</th><th>状态</th></tr></thead><tbody>'+PLAN.map(plan=>'<tr><td>'+esc(plan.id)+'</td><td>'+esc(a(plan.atom).short)+'</td><td>'+esc(plan.title)+' <span class="muted">← '+esc(plan.depends)+'</span></td><td><span class="tag good">完成</span></td></tr>').join("")+'</tbody></table></div></details><details><summary>查看补充材料与本轮检查</summary><div class="card"><b>analysis/buffer_sensitivity.csv</b><p>已接收 · 模型规格与样本一致；用于 A-02 的 A1、A2 修改。</p></div><div class="card"><b>cohort_flow.csv</b><p>已接收 · 核对缺失重叠人数；用于 A-04 的 A1 修改。</p></div><ul class="checklist"><li class="done">修订事项与回复逐项对应</li><li class="done">6 项计划修改已完成</li><li class="done">6 条原始意见均有回复</li><li>用户核对本轮候选；正式确认仍待对话</li></ul></details>'+roundAppendix()+sourceFiles("11-manuscript-revision-guide.md · 12-manuscript-execution-graph.md · 13-revision-action-log.md · 14-response-coverage-matrix.md · 15/16-response-letter-preview · 17-final-assembly-checklist.md")+'</section>';
    }
    function stagePanel(){return state.stage==="coverage"?coverageView():state.stage==="workboard"?workboardView():state.stage==="strategy"?strategyView():roundView();}
    function guide(){
      const instructions={
        coverage:["先核对原文","读中间的原始意见，点选标色片段。右侧核对拆分、合并及稿件位置；遗漏或异议写在“我的反馈”。"],
        workboard:["先看修订安排","浏览五项工作的优先级和下一步，选中一项查看证据与依赖；逐项留下意见后确认整体安排。"],
        strategy:["聚焦当前策略","核对建议立场、计划修改和所需材料。当前事项有缺口时写明建议，仍可浏览其他策略。"],
        round:["逐条核对改动与回复","先读所选意见的回复和稿件前后对照，再查看六条意见是否都已覆盖。"]
      };
      const [title,description]=instructions[state.stage];
      return '<div class="task-guide"><strong>'+title+'</strong><p>'+description+'</p></div>';
    }
    function render(){
      byId("stages").innerHTML=STAGES.map(item=>'<button type="button" data-stage="'+item.id+'" aria-pressed="'+(state.stage===item.id)+'"><b>'+item.number+' · '+esc(item.label)+'</b><small>'+esc(item.hint)+'</small></button>').join("");
      byId("notice").innerHTML='<div class="statline"><span class="tag">'+esc(stage().snapshot)+'</span><span class="small">'+esc(t(state.thread).short)+' → '+esc(a(state.atom).short)+' → '+esc(a(state.atom).locations.map(id=>m(id).locator).join("、"))+'</span></div><p class="small">'+esc(state.message)+'</p>';
      byId("workspace").innerHTML='<div class="workspace">'+rail()+'<main class="column">'+guide()+stagePanel()+'</main><aside class="column side-column">'+trace()+feedback()+'</aside></div>';
    }
    function selectThread(id){state.thread=id;state.doc=docForThread(id).id;if(!linkedAtoms(id).includes(state.atom))state.atom=linkedAtoms(id)[0];state.message="已定位 "+t(id).short+" 的原文、修订事项与回复。";render();}
    function selectAtom(id){state.atom=id;if(!linkedThreads(id).includes(state.thread))state.thread=linkedThreads(id)[0];state.doc=docForThread(state.thread).id;state.message="已定位 "+a(id).short+" 的来源与稿件位置。";render();}
    function canConfirm(){
      if(state.stage==="round")return true;
      const ids=state.stage==="strategy"?[activeAtom]:ATOMS.map(item=>item.id);
      return ids.every(id=>{const choice=state.decisions[state.stage+":"+id];return choice==="accept"||(state.stage==="workboard"&&choice==="defer");});
    }
    function syncUrl(){const url=new URL(location.href);url.searchParams.delete("variant");url.searchParams.set("stage",state.stage);try{history.replaceState(null,"",url);}catch(_){}}
    document.addEventListener("click",event=>{
      const listSummary=event.target.closest(".rail .atom-list summary");if(listSummary){state.atomListOpen=!listSummary.parentElement.open;return;}
      const button=event.target.closest("button");if(!button)return;
      if(button.dataset.span){const part=spans(DOCS.find(doc=>doc.id===state.doc))[Number(button.dataset.span)];if(part.thread){selectThread(part.thread);if(part.atoms.length===1)selectAtom(part.atoms[0]);}return;}
      if(button.dataset.stage){state.stage=button.dataset.stage;syncUrl();state.message="正在浏览 "+stage().snapshot+"。";render();return;}
      if(button.dataset.thread){selectThread(button.dataset.thread);return;}
      if(button.dataset.atom){selectAtom(button.dataset.atom);return;}
      if(button.dataset.doc){state.doc=button.dataset.doc;state.message="已切换原始文档。";render();return;}
      if(button.dataset.switch){state.focusRequest=button.dataset.switch;state.message="已记录切换到 "+a(state.focusRequest).short+" 的请求。";render();return;}
      switch(button.dataset.action){
        case "confirm":if(!canConfirm()){state.message="仍有未处置或需调整的事项；请先写明反馈。";}else{state.confirmed[confirmKey()]=true;state.message=state.stage==="round"?"已标记本轮预览看完；正式结果仍需回到对话确认。":"已记录本次确认；交回后由助手核对。";}render();break;
        case "summary":byId("summary-json").textContent=JSON.stringify({kind:"revision-master-prototype-feedback",snapshot:stage().snapshot,decisions:state.decisions,notes:state.notes,confirmations:state.confirmed,focus_request:state.focusRequest},null,2);byId("summary-dialog").showModal();break;
        case "close-summary":byId("summary-dialog").close();break;
        case "reset":state=initial();state.message="本地试用状态已重置。";render();break;
      }
    });
    document.addEventListener("change",event=>{const key=event.target.dataset.decision;if(!key)return;state.decisions[key]=event.target.value;delete state.confirmed[confirmKey()];state.message="已记录当前事项的处置。";render();});
    document.addEventListener("input",event=>{const key=event.target.dataset.note;if(!key)return;state.notes[key]=event.target.value;delete state.confirmed[confirmKey()];event.target.closest(".feedback").querySelector(".status").textContent="待确认 · 批注已更新";});
    render();
  </script>
</body>
</html>
