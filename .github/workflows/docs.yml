name: Docs

on:
  push:
    branches: [main]
    paths:
      - "src/cli/command-catalog.ts"
      - "src/cli/handbook.ts"
      - "website/**"
      - "scripts/generate-docs.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "src/cli/command-catalog.ts"
      - "src/cli/handbook.ts"
      - "website/**"
      - "scripts/generate-docs.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm docs:check
      - run: cd website && pnpm install && pnpm build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install && pnpm docs:generate
      - run: cd website && pnpm install && pnpm build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - id: deployment
        uses: actions/deploy-pages@v4
