name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22
          - 24

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run public and focused tests
        run: pnpm test

      - name: Run lint and typecheck
        run: pnpm lint && pnpm check

      - name: Validate converter output
        run: pnpm arsu:check

      - name: Validate converter idempotence
        run: pnpm arsu:idempotence

      - name: Verify installable package
        run: pnpm release:verify

      - name: Validate main OpenSpec capabilities
        run: pnpm dlx @fission-ai/openspec@1.5.0 validate --specs --strict --no-interactive
