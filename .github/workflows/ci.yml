name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev-refactor
  workflow_dispatch:
    inputs:
      semantic_search:
        description: Run real local multilingual embedding acceptance (downloads model/runtime)
        type: boolean
        default: false

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: '0'
  DO_NOT_TRACK: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-search:
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_search
    name: Semantic search / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm semantic-search:smoke --yes
        env:
          RESEARCHSPEC_SEARCH_CACHE: ${{ runner.temp }}/researchspec-search

  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24

    steps:
      - name: Preserve Git bytes and enable Windows long paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Use a physical temporary directory outside the checkout hierarchy on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test_temp=$(mktemp -d /private/tmp/researchspec-ci.XXXXXX)
          printf 'TMPDIR=%s\n' "$test_temp" >> "$GITHUB_ENV"

      - name: Use the long temporary directory path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'researchspec-tmp'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out pinned vendor inputs
        run: git submodule update --init --jobs 4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Expose Python 3 to Windows validators
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $python3 = Join-Path (Split-Path $python) python3.exe
          if (!(Test-Path -LiteralPath $python3)) {
            Copy-Item -LiteralPath $python -Destination $python3
          }
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.17'
      - name: Install locked Python test environment
        run: uv sync --project tests/python --locked
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/researchspec-test-python

      - name: Set up Pandoc for review workspace tests
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: '3.8.3'

      - name: Run public and focused tests
        run: pnpm test
        env:
          REQUIRE_REVIEW_BROWSER: ${{ runner.os == 'Linux' && '1' || '' }}
          RESEARCHSPEC_TEST_PYTHON_PROJECT: ${{ github.workspace }}/tests/python
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/researchspec-test-python
          PYTHONUTF8: '1'

      - name: Run lint and typecheck
        run: pnpm lint && pnpm check

      - name: Validate converter output
        run: pnpm arsu:check

      - name: Validate converter idempotence
        run: pnpm arsu:idempotence

      - name: Validate fixed Zotero adapter output
        run: pnpm zotero-adapter:check && pnpm zotero-adapter:idempotence

      - name: Verify installable package
        run: pnpm release:verify

      - name: Validate main OpenSpec capabilities
        run: pnpm dlx @fission-ai/openspec@1.5.0 validate --specs --strict --no-interactive

      - name: Validate reviewed converter and audit inputs
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          pnpm arsu:anchors:check
          pnpm arsu:runtime-policy:check
          pnpm zotero-adapter:audit
          pnpm tooluniverse:check
          pnpm tooluniverse:idempotence
          pnpm scientific-agent-skills:check
          pnpm scientific-agent-skills:idempotence
          pnpm materials-science-skills-for-llm:check
          pnpm materials-science-skills-for-llm:idempotence
          pnpm finrobot:check
          pnpm finrobot:idempotence
          pnpm histagent:check
          pnpm histagent:idempotence
          pnpm education-agent-skills:audit:check
          pnpm education-agent-skills:evidence:check
          pnpm education-agent-skills:check
          pnpm education-agent-skills:idempotence
          pnpm patent:check
          pnpm patent:idempotence
          pnpm own-vendor-maintenance:check

      - name: Test the maintainer dogfooding harness
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node --test tests/dogfood-harness.test.mjs
