name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      semantic_search:
        description: Run real local multilingual embedding acceptance (downloads model/runtime)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-search:
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_search
    name: Semantic search / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm semantic-search:smoke --yes
        env:
          RESEARCHSPEC_SEARCH_CACHE: ${{ runner.temp }}/researchspec-search

  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run public and focused tests
        run: pnpm test

      - name: Run lint and typecheck
        run: pnpm lint && pnpm check

      - name: Validate converter output
        run: pnpm arsu:check

      - name: Validate converter idempotence
        run: pnpm arsu:idempotence

      - name: Check out fixed Zotero adapter maintenance input
        run: git submodule update --init vendor/zotero-library-agent-bundle

      - name: Validate fixed Zotero adapter output
        run: pnpm zotero-adapter:check && pnpm zotero-adapter:idempotence

      - name: Verify installable package
        run: pnpm release:verify

      - name: Validate main OpenSpec capabilities
        run: pnpm dlx @fission-ai/openspec@1.5.0 validate --specs --strict --no-interactive
