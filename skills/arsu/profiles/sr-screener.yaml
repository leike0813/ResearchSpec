    node_ids:
      - pilot-a
      - pilot-b
    join_policy: all
  - group_id: ta-reviewers
    node_ids:
      - ta-a
      - ta-b
    join_policy: all
  - group_id: ft-reviewers
    node_ids:
      - ft-a
      - ft-b
    join_policy: all
gates:
  - gate_id: protocol-confirmation
    owner_node_id: protocol-confirmation
    policy: required
    verdicts:
      - pass
      - pass_with_conditions
      - fail
  - gate_id: pilot-approval
