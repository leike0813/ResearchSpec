schema_version: "2"
profile_id: sr-screener
profile_version: 0.1.0
capability_registry_version: 0.1.0
entries:
  - entry_id: main
    kind: end-to-end
    node_id: protocol
    route_ref: sr-screener:protocol
    confirmation_summary:
      title: Full systematic review screening run
      prerequisites: review proposal; screening data identity; pilot records and
        labels; screening records; full-text materials; human-confirmed
        decisions
      boundary_outputs:
        - role: prisma_counts
          type: prisma_counts
          purpose: Final PRISMA flow counts reconciled with screening decisions.
          structure: A self-contained report of identified, screened, excluded, and
            included records with reasons and unresolved counts.
          validation_profile: text-artifact
        - role: literature_corpus
          type: literature_corpus
          purpose: Final included-study corpus for downstream research work.
          structure: A structured bibliography corpus linked to the confirmed screening
            decisions.
          validation_profile: text-artifact
      risk_cost: high; high/long_horizon
nodes:
  - node_id: protocol
    kind: capability
    capability_id: screening-protocol
    input_bindings:
      - role: review_proposal
        source: handoff
    expected_outputs:
      - role: screening_protocol
        required: true
      - role: screening_config
        required: true
    prerequisites: []
    required_gate_ids: []
    required_decision_ids: []
    multiplicity: one
    round_role: null
  - node_id: protocol-confirmation
    kind: gate
    input_bindings: []
    expected_outputs: []
    prerequisites:
      - protocol
    required_gate_ids: []
    required_decision_ids: []
    multiplicity: one
    round_role: null
  - node_id: pilot-a
    kind: capability
    capability_id: screening-review-ballot
    input_bindings:
      - &a1
        role: screening_protocol
        source: node_output
        from_node_id: protocol
        from_role: screening_protocol
      - &a2
        role: screening_config
        source: node_output
        from_node_id: protocol
        from_role: screening_config
      - &a3
        role: pilot_records
        source: handoff
      - role: stage
        source: parameter
        value: pilot
      - role: reviewer_seat
        source: parameter
        value: A
    expected_outputs:
      - role: review_ballot
        required: true
    prerequisites:
      - protocol-confirmation
    required_gate_ids: []
    required_decision_ids: []
    multiplicity: one
    round_role: null
  - node_id: pilot-b
