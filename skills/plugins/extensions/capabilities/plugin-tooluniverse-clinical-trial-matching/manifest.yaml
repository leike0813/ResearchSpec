schema_version: "1"
capability_id: plugin-tooluniverse-clinical-trial-matching
title: Clinical Trial Matching for Precision Medicine
description: AI-driven patient-to-trial matching for precision oncology and
  rare-disease care. Transforms a patient's molecular profile (mutations,
  biomarkers, expression) and clinical state into ranked clinical-trial
  recommendations with evidence tiers. Searches ClinicalTrials.gov, the EU CTIS
  register (European/EEA trials), AND the ISRCTN registry (UK/international)
  plus cross-references CIViC, OpenTargets, ChEMBL, and FDA labels. Use for
  matching patients to trials by genotype, biomarker-driven trial selection,
  trial-eligibility scoring, and finding trials across the US, Europe, and the
  UK.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
