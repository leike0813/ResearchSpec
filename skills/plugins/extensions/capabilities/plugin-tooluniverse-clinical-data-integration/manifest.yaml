schema_version: "1"
capability_id: plugin-tooluniverse-clinical-data-integration
title: Clinical Data Integration for Drug Safety
description: End-to-end drug safety review integrating FDA labels, FAERS adverse
  event reports, PRR/ROR disproportionality, pharmacogenomic biomarkers,
  clinical trial data, and published literature. Use for regulatory drug safety
  reviews, comprehensive pharmacovigilance reports, label-vs-real-world AE
  comparison, and clinical decision support for drug safety.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/tooluniverse/tooluniverse-clinical-data-integration/SKILL.md
      sha256: fead0d5b57cb7386cd20b6fd9dd12fbdd5688abd63f42a5f7267d1023d59be8c
