schema_version: "1"
capability_id: plugin-tooluniverse-aging-senescence
title: Aging & Cellular Senescence Research
description: Aging biology, cellular senescence, and longevity research. Covers
  senescence markers (p16/CDKN2A, SASP, SA-beta-gal), aging hallmarks, senolytic
  drug discovery (dasatinib+quercetin, fisetin, navitoclax), epigenetic clocks,
  telomere biology, and longevity GWAS. Use for senescence-pathway analysis,
  age-related disease genetics, senolytic-target discovery, and
  centenarian-genetics queries. Distinguishes correlative vs causal evidence
  (knockout, intervention).
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
