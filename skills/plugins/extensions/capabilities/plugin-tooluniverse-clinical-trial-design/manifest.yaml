schema_version: "1"
capability_id: plugin-tooluniverse-clinical-trial-design
title: Clinical Trial Design Feasibility Assessment
description: Strategic clinical trial design feasibility assessment. Analyzes 6
  dimensions (endpoint, population, comparator, effect size, duration,
  regulatory pathway) using precedent trials and FDA guidance. Produces
  enrollment projections, endpoint recommendations, and approval-pathway
  analysis. Use for trial-protocol design, power/sample-size estimation,
  comparator selection, and FDA submission strategy. Driven by precedent-based
  reasoning rather than first-principles math.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
