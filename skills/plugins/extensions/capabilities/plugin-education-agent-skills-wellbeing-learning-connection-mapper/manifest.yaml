schema_version: "1"
capability_id: plugin-education-agent-skills-wellbeing-learning-connection-mapper
title: Wellbeing-Learning Connection Mapper
description: Map evidence-based connections between a wellbeing initiative and
  specific academic learning outcomes. Use when justifying wellbeing programmes,
  integrating SEL, or linking pastoral and academic work.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
