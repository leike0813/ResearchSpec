schema_version: "1"
capability_id: plugin-education-agent-skills-retrieval-practice-generator
title: Retrieval Practice Question Generator
description: Generate retrieval practice questions at varied difficulty levels
  for a topic or concept. Use when creating quiz starters, revision activities,
  or low-stakes testing materials.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: education-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_education_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/education-agent-skills/education-agent-skills-retrieval-practice-generator/SKILL.md
      sha256: fa2559d1f2c617412686a7948224a8ad1a9e97498e6cf8df0bf3170a866e7ccd
