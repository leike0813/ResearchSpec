schema_version: "1"
capability_id: plugin-tooluniverse-systems-biology
title: Systems Biology & Pathway Analysis
description: Systems biology and pathway analysis integrating Reactome, KEGG,
  WikiPathways, BioCarta, NCI-Nature Pathway Interaction Database.
  Multi-database pathway enrichment, protein-pathway relationships, network
  reasoning. Use for pathway analysis on a gene list, multi-source pathway
  concordance, and systems-level interpretation across databases.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
