capability_id: plugin-education-agent-skills-interdisciplinary-real-world-connection-mapper
title: Interdisciplinary Real-World Connection Mapper
description: Map curriculum connections across multiple subjects for a
  real-world problem or authentic context. Use when planning cross-curricular
  projects or connecting content to real issues.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
