title: AI Output Critical Audit Designer
description: Design a structured protocol for auditing AI-generated text against
  Ennis's six CT standards. Use when students need to critically evaluate AI
  output in any subject.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
