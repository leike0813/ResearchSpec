schema_version: "1"
capability_id: plugin-scientific-agent-skills-liteparse
title: LiteParse — Local Document Parsing
description: Local document and PDF parsing with spatial text and bounding
  boxes. Use for extracting text from PDFs, DOCX, Office files, and images; OCR
  on scans; layout-preserved JSON for RAG; batch-ingesting paper folders; or
  page screenshots for multimodal agents — even when the user does not name
  liteparse. Prefer over MarkItDown when you need bboxes, fast local parsing, or
  PNG page renders; prefer over the pdf skill for merge/split/forms.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
