schema_version: "1"
capability_id: plugin-scientific-agent-skills-markitdown
title: MarkItDown
description: Converts heterogeneous documents and selected URIs to Markdown with
  Microsoft MarkItDown for text analysis, search, and LLM/RAG ingestion. Covers
  safe local conversion, streams, Office/PDF/data formats, batch workflows,
  plugins, vision OCR, Azure extraction, and the official MCP server.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
