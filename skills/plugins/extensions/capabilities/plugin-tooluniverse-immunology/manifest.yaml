schema_version: "1"
capability_id: plugin-tooluniverse-immunology
title: Immunology Research Skill
description: "Immunology research workflows: antibody-antigen interactions, T/B
  cell repertoire, MHC/HLA binding prediction, autoimmune disease genetics,
  vaccine epitope mapping. Uses IEDB, IMGT, SAbDab, UniProt. Use for adaptive
  immunity questions, immune response analysis, antibody/TCR/BCR
  characterization, immunogenicity prediction, and immune-pathway-to-disease
  mapping."
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/tooluniverse/tooluniverse-immunology/SKILL.md
      sha256: 60db512a8ee66dc01639e7733e87c20804997e01bb5008b1de89c57740c3aefd
