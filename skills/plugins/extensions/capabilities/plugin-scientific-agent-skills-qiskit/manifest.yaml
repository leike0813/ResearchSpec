schema_version: "1"
capability_id: plugin-scientific-agent-skills-qiskit
title: Qiskit
description: IBM quantum computing framework. Use when targeting IBM Quantum
  hardware, working with Qiskit Runtime for production workloads, or needing IBM
  optimization tools. Best for IBM hardware execution, quantum error mitigation,
  and enterprise quantum computing. For Google hardware use cirq; for
  gradient-based quantum ML use pennylane; for open quantum system simulations
  use qutip.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
