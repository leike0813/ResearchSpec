schema_version: "1"
capability_id: plugin-scientific-agent-skills-parallel-web
title: Parallel Web Toolkit
description: Use Parallel CLI for web search, URL extraction, deep research,
  structured data enrichment, entity discovery, and recurring web monitoring.
  Best for requests that explicitly need current web evidence, academic-source
  discovery, repeated entity lookups, exhaustive reports, or ongoing change
  tracking.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
