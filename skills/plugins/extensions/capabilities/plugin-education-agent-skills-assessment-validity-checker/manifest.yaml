schema_version: "1"
capability_id: plugin-education-agent-skills-assessment-validity-checker
title: Assessment Validity Checker
description: Audit a proposed assessment for construct validity, reliability,
  and alignment to learning objectives. Use when reviewing or quality-assuring
  assessments before deployment.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: education-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_education_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/education-agent-skills/education-agent-skills-assessment-validity-checker/SKILL.md
      sha256: bf599d02c461406ceb7d26102ae0dc20ab8f67c152eadeca18fe8f952ed83806
