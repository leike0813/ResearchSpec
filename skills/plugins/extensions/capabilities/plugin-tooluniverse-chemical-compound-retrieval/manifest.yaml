schema_version: "1"
capability_id: plugin-tooluniverse-chemical-compound-retrieval
title: Chemical Compound Information Retrieval
description: Retrieve chemical compound data from PubChem and ChEMBL with
  disambiguation, cross-referencing, and stereochemistry handling. Use for
  resolving compound names to SMILES/InChI/CID/ChEMBL IDs (including OPSIN
  deterministic IUPAC-name-to-structure parsing), fetching molecular properties,
  distinguishing isomers/stereo forms, and cross-validating identity across
  databases. Always use English compound names; flags ambiguous queries (e.g.,
  Vitamin D has multiple forms).
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
