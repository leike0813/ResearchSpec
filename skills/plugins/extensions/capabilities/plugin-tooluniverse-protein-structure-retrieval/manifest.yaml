schema_version: "1"
capability_id: plugin-tooluniverse-protein-structure-retrieval
title: Protein Structure Data Retrieval
description: Protein structure retrieval from RCSB PDB, PDBe, AlphaFold,
  SWISS-MODEL, 3D-Beacons (cross-provider structure aggregator), and PDB-REDO
  (re-refined X-ray structures), with disambiguation, quality assessment
  (resolution, R-factor, pLDDT, coverage), and metadata. Distinguishes
  high-quality experimental (X-ray under 2 Angstrom) vs predicted vs
  homology-model vs medium-quality structures. Use for fetching protein
  structures, structure-quality comparison, batch model-availability checks
  across a gene list, checking every structure provider at once, and selecting
  structures for drug design or modeling.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
