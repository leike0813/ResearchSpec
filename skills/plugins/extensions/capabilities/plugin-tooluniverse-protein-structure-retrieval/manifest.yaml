schema_version: "1"
capability_id: plugin-tooluniverse-protein-structure-retrieval
title: Protein Structure Data Retrieval
description: Protein structure retrieval from RCSB PDB, PDBe, and AlphaFold with
  disambiguation, quality assessment (resolution, R-factor, pLDDT), and
  metadata. Distinguishes high-quality experimental (X-ray under 2 Angstrom) vs
  predicted vs medium-quality structures. Use for fetching protein structures,
  structure-quality comparison, and selecting structures for drug design or
  modeling.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
