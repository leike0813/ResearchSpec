schema_version: "1"
capability_id: plugin-tooluniverse-gwas-drug-discovery
title: GWAS-to-Drug Target Discovery
description: Transform GWAS signals into drug targets and repurposing
  opportunities. Connects GWAS-significant loci to causal genes via
  fine-mapping/eQTL, then to druggable proteins via DGIdb/OpenTargets, then to
  existing drugs via ChEMBL. Use for GWAS-to-target hypothesis generation,
  druggable-fraction analysis of disease loci, and human-genetics-validated
  drug-repurposing prioritization.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
