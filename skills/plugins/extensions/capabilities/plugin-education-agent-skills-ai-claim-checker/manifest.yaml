schema_version: "1"
capability_id: plugin-education-agent-skills-ai-claim-checker
title: AI Claim Checker
description: After any AI-generated explanation, require the learner to identify
  one place it could be wrong, one thing to check, and one source to consult.
  Builds epistemic vigilance — treats AI output as a claim to evaluate, not
  truth to absorb.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: education-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_education_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/education-agent-skills/education-agent-skills-ai-claim-checker/SKILL.md
      sha256: 49f5db5ddcdbfb717c25a8dfda75ef5807eeb05623bc8570eab9aa3840b48abb
