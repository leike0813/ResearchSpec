schema_version: "1"
capability_id: plugin-tooluniverse-multiomic-disease-characterization
title: Multi-Omics Disease Characterization Pipeline
description: Comprehensive disease characterization across genomics,
  transcriptomics, proteomics, and pathways for systems-level understanding.
  Identifies therapeutic opportunities and biomarker candidates by integrating
  multi-layer molecular data. Use for full-omics disease deep-dive reports,
  mechanism mapping, and biomarker-and-target identification from multi-omics
  data.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
