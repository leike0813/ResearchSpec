schema_version: "1"
capability_id: plugin-scientific-agent-skills-analytical-method-validation
title: Analytical Method Validation
description: Plan, execute, and document validation, verification, and transfer
  of analytical procedures under the governing framework - ICH Q2(R2) and Q14,
  USP <1220>/<1225>/<1226>, ICH M10 bioanalytical, CLSI EP, or ISO/IEC 17025.
  Use for HPLC, LC-MS/MS, GC, CE, ICP-MS, dissolution, qNMR, qPCR, NIR, and
  ligand binding or cell-based assays whenever the question is whether a
  procedure is fit for its intended purpose. Triggers include "method
  validation", "analytical method validation", "AMV", "validation protocol",
  "acceptance criteria", "linearity", "reportable range", "accuracy and
  precision", "repeatability", "intermediate precision", "recovery", "LOD",
  "LOQ", "detection limit", "quantitation limit", "specificity", "robustness",
  "method transfer", "method comparison", "Deming", "Passing-Bablok",
  "Bland-Altman", "equivalence testing", "OOS investigation", "ICH Q2",
  "Q2(R2)", "Q14", "USP 1225", "ICH M10", "incurred sample reanalysis", "ISR",
  "CLSI EP", and any request to show that an assay works.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
