title: Scope and Sequence Designer
description: Design a scope and sequence showing vertical and horizontal
  curriculum coherence across a programme or year. Use when building new
  programmes, restructuring subjects, or ensuring progression.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
