schema_version: "1"
capability_id: plugin-tooluniverse-single-cell
title: Single-Cell Genomics and Expression Matrix Analysis
description: Single-cell RNA-seq analysis with scanpy/anndata — h5ad data
  loading, scRNA-seq quality control and QC gating (n_genes_by_counts,
  total_counts, mitochondrial percent / pct_counts_mt, pct_counts_ribo, doublet
  detection with Scrublet/scDblFinder, ambient RNA / SoupX awareness,
  empty-droplet filtering, MAD-based thresholds), normalization, dimensionality
  reduction (PCA, UMAP, t-SNE), clustering (Leiden, Louvain), marker gene
  identification, cell-type annotation, pseudotime/trajectory analysis. Use for
  any scRNA-seq workflow, including deciding which cells to filter, flag, or
  investigate before downstream analysis.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
