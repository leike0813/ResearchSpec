schema_version: "1"
capability_id: plugin-tooluniverse-gwas-finemapping
title: GWAS Fine-Mapping & Causal Variant Prioritization
description: Statistical fine-mapping of GWAS loci using credible sets (SuSiE,
  FINEMAP) and locus-to-gene scoring (Open Targets L2G). Identifies likely
  causal variants and target genes — distinct from positional 'nearest gene'
  which is often wrong. Use for prioritizing causal variants at GWAS hits,
  comparing fine-mapping methods, and converting lead SNPs to target genes.
maturity: operational
