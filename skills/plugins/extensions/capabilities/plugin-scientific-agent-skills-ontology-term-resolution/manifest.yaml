schema_version: "1"
capability_id: plugin-scientific-agent-skills-ontology-term-resolution
title: Ontology Term Resolution
description: Resolve free-text scientific labels to ontology term IDs and
  validate existing CURIEs against the EBI Ontology Lookup Service (OLS4). Also
  look up prefixes in Bioregistry, resolve compact identifiers via
  Identifiers.org, map lab shorthand with ZOOMA, and build Ontobee term pages.
  Use whenever an ontology identifier must be produced or checked - annotating
  tissue, cell type, disease, phenotype, assay, chemical, organism, sex, or
  developmental stage fields; preparing metadata for GEO, ENA, BioSamples,
  CELLxGENE, HCA, or ISA-Tab submission; auditing a metadata table of term IDs;
  checking whether a term is obsolete and what replaced it; or deciding HPO vs
  HP. Triggers include "ontology term", "ontology ID", "CURIE", "controlled
  vocabulary", "UBERON", "CL:", "MONDO", "HPO", "EFO", "ChEBI", "NCBITaxon", "GO
  term", "PATO", "Zooma", "Bioregistry", "Identifiers.org", "Ontobee", "annotate
  this tissue/cell type/disease", and any request to emit or verify an
  identifier shaped like PREFIX:0001234.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
