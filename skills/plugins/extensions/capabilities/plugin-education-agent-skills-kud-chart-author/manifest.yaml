schema_version: "1"
capability_id: plugin-education-agent-skills-kud-chart-author
title: What This Skill Does
description: Authors or reviews Know/Understand/Do charts for competency-based
  learning targets across developmental bands. Handles seven input types from
  raw curriculum documents to existing LT sets. Routes to upstream skills when
  stronger inputs are available.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: education-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_education_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/education-agent-skills/education-agent-skills-kud-chart-author/SKILL.md
      sha256: 97e92108361d76e807acb408c475f04d07a810511319883e8a972a0ccfd11251
