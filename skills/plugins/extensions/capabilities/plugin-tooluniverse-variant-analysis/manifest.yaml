schema_version: "1"
capability_id: plugin-tooluniverse-variant-analysis
title: Variant Analysis and Annotation
description: VCF and variant analysis — parsing, annotation, classification
  (synonymous, missense, frameshift, stop_gained), VAF filtering, coding vs
  non-coding categorization, multi-condition variant comparison. Use for VCF
  parsing, variant fraction calculations (denominator = coding subset only, NOT
  all variants), and per-sample mutation profiling.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
