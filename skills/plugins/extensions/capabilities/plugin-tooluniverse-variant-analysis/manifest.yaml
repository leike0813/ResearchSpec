schema_version: "1"
capability_id: plugin-tooluniverse-variant-analysis
title: Variant Analysis and Annotation
description: Parse and annotate VCFs, classify and filter variants, compare
  mutation profiles across samples, and calculate coding-subset variant
  fractions. Resolve variant notation and genomic coordinates across reference
  assemblies and transcripts. Cross-check archive cohorts, allele frequencies,
  clinical annotations, principal transcripts, linkage disequilibrium, and
  feature overlaps with their source and evidence limits.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
