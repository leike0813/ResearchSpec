schema_version: "1"
capability_id: plugin-tooluniverse-rnaseq-deseq2
title: RNA-seq Differential Expression Analysis (DESeq2)
description: RNA-seq differential expression analysis with DESeq2, edgeR, and
  limma-voom — DEG lists, fold changes, dispersion estimation, design formulas
  including covariates, multi-condition contrasts, and Venn-set operations
  across groups. Routes across DESeq2 (default), edgeR (QL-F / exact test for
  small replicate counts), and limma-voom (large n / complex designs). Use when
  you have a count matrix + metadata, want to find DEGs, or need
  dispersion/PCA/clustering analysis. Includes RULE ZERO precedence (read
  executed.ipynb if present).
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
