schema_version: "1"
capability_id: plugin-tooluniverse-cancer-classification
title: Cancer Classification via OncoTree
description: Translate free-text tumor descriptions to OncoTree codes and
  resolve cancer subtypes/tissue hierarchy. Cross-references UMLS/NCI
  vocabularies. Use for standardizing cancer-type nomenclature in EHR free-text,
  building cohorts in OncoKB or GDC, mapping tumor-board notes to ontology
  codes, and ensuring consistent terminology across cancer-genomics pipelines.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
