schema_version: "1"
capability_id: plugin-education-agent-skills-agency-scaffold-generator
title: Agency Scaffold Generator
description: Generate scaffolds that gradually increase student choice, voice,
  and ownership within a learning task. Use when students depend heavily on
  teacher direction and need to develop autonomy.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: education-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_education_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/education-agent-skills/education-agent-skills-agency-scaffold-generator/SKILL.md
      sha256: 81b72ae6ca795cdd9ead1c6d5deedf584a806e00c06d0cc845fc7700333f7b3c
