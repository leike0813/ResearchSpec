schema_version: "1"
capability_id: plugin-tooluniverse-organic-chemistry
title: Organic Chemistry Reasoning Guide
description: Organic chemistry reasoning guide for reaction product prediction,
  mechanism analysis (electrophilic/nucleophilic substitution, addition,
  elimination, pericyclic, radical), and spectroscopy interpretation (1H/13C
  NMR, IR, MS). Reasons from first principles (electron flow, kinetic vs
  thermodynamic) rather than pattern-matching named reactions. Use for organic
  synthesis problems and mechanism explanations.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
