schema_version: "1"
capability_id: plugin-tooluniverse-variant-interpretation
title: Clinical Variant Interpreter
description: Clinical variant interpretation from raw variant calls to
  ACMG-classified recommendations with structural impact analysis. Use for VUS
  classification, pathogenicity assessment with cited criteria, structure-based
  variant impact (AlphaFold/PDB), non-coding/regulatory variant effect
  prediction with sequence deep-learning models (AlphaGenome, Enformer, Borzoi,
  ChromBPNet, Evo 2), and producing clinical-grade variant reports for return of
  results or molecular tumor boards. Use this whenever a user asks about a
  variant's significance, an intronic/promoter/enhancer/UTR non-coding variant's
  functional impact, or needs ACMG classification — even if they don't say
  "ACMG".
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
