schema_version: "1"
capability_id: plugin-tooluniverse-proteomics-data-retrieval
title: Proteomics Data Retrieval
description: Find and retrieve proteomics datasets from MassIVE,
  ProteomeXchange, PRIDE Archive, and the NCI Proteomics Data Commons (PDC).
  Search by species, keyword, accession, or protein; retrieve detailed metadata
  (instruments, publications, species, PTMs studied), real file-download URLs
  (PRIDE), or quantitative abundance matrices with clinical linkage (PDC/CPTAC).
  Use for locating public proteomics datasets to reanalyze, comparing
  instrument/protocol coverage across studies, pre-download dataset evaluation,
  and finding every dataset that identified a specific protein.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
