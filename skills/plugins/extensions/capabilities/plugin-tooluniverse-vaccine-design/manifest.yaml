schema_version: "1"
capability_id: plugin-tooluniverse-vaccine-design
title: Vaccine Design
description: "Computational vaccine candidate design: peptide/subunit vaccines
  via MHC-I/MHC-II epitope prediction (IEDB), population HLA coverage
  optimization, B-cell epitope identification, and cross-strain conservation
  analysis. Use for vaccine epitope prediction, HLA allele coverage,
  multi-epitope construct design, and immunogenicity assessment. Combines
  predicted MHC binding with experimentally validated IEDB epitopes for
  higher-confidence designs."
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
