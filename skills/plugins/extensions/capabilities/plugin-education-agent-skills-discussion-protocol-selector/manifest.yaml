title: Discussion Protocol Selector & Facilitation Guide
description: Select and configure a structured discussion protocol matched to
  the purpose, topic, and group readiness. Use when planning classroom
  discussions, Socratic seminars, or structured debate.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
