capability_id: plugin-scientific-agent-skills-cantera
title: "Cantera: homogeneous ignition calculations"
description: Runs Cantera homogeneous chemical reactors and evaluates ignition
  delay with mechanism provenance, conservation checks, and numerical
  refinement. Use for combustion kinetics, closed adiabatic ideal-gas
  constant-volume or constant-pressure ignition, temperature histories, or
  mechanism-specific ignition-delay comparisons.
