schema_version: "1"
capability_id: plugin-tooluniverse-molecular-cloning
title: Molecular Cloning Assembly Design (Gibson & Golden Gate)
description: Molecular cloning assembly design — Gibson Assembly (overlap design
  for seamless multi-fragment joining) and Golden Gate Assembly (Type IIS / BsaI
  / BbsI design with unique 4-bp fusion overhangs). Use when you need to plan
  how to join DNA fragments into a construct, design assembly
  overlaps/overhangs, or decide between cloning methods. Covers the
  domestication (internal-site removal), overhang-uniqueness, and overlap-Tm
  rules. For PCR primers to generate the fragments, see
  tooluniverse-primer-design.
