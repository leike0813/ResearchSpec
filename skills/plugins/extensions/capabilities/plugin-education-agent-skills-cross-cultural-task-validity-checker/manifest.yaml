schema_version: "1"
capability_id: plugin-education-agent-skills-cross-cultural-task-validity-checker
title: Cross-Cultural Task Validity Checker
description: Check an educational practice or task for cultural bias, WEIRD
  assumptions, and cross-cultural validity. Use when adapting resources for
  diverse contexts or questioning universal claims.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: education-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_education_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/education-agent-skills/education-agent-skills-cross-cultural-task-validity-checker/SKILL.md
      sha256: 366fa5a9bda8ad0046238db105343655eeed4243319281a951bc1004aa5f8eb5
