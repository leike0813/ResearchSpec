schema_version: "1"
capability_id: plugin-scientific-agent-skills-open-notebook
title: Open Notebook
description: Self-hosted, open-source alternative to Google NotebookLM for
  AI-powered research and document analysis. Use when organizing research
  materials into notebooks, ingesting diverse content sources (PDFs, videos,
  audio, web pages, Office documents), generating AI-powered notes and
  summaries, creating multi-speaker podcasts from research, chatting with
  documents using context-aware AI, searching across materials with full-text
  and vector search, or running custom content transformations. Supports 16+ AI
  providers including OpenAI, Anthropic, Google, Ollama, Groq, and Mistral with
  complete data privacy through self-hosting.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
