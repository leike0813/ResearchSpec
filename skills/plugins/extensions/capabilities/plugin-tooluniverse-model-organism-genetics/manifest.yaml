schema_version: "1"
capability_id: plugin-tooluniverse-model-organism-genetics
title: Model Organism Genetics Pipeline
description: Cross-species genetic analysis using model organism databases (MGI
  mouse, IMPC systematic knockout phenotyping, ZFIN zebrafish, FlyBase fruit
  fly, WormBase worm, SGD budding yeast plus protein-domain/PTM/literature
  detail, PomBase fission yeast, RGD rat, GeneNetwork systems-genetics/eQTL
  panels, HumanMine/MouseMine cross-species data-warehouse search, GBIF
  taxonomy) plus VEuPathDB for eukaryotic pathogens (Plasmodium, Toxoplasma,
  fungi, vectors). Maps human genes to orthologs, retrieves
  phenotype/expression/functional data, assesses gene function conservation, and
  identifies the best animal model for studying a human gene or disease.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
