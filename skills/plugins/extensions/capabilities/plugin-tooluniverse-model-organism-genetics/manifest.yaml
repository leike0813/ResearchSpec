schema_version: "1"
capability_id: plugin-tooluniverse-model-organism-genetics
title: Model Organism Genetics Pipeline
description: Cross-species genetic analysis using model organism databases (MGI
  mouse, ZFIN zebrafish, FlyBase fruit fly, WormBase worm, SGD yeast, RGD rat,
  GBIF taxonomy). Maps human genes to orthologs, retrieves
  phenotype/expression/functional data, assesses gene function conservation, and
  identifies the best animal model for studying a human gene or disease.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
