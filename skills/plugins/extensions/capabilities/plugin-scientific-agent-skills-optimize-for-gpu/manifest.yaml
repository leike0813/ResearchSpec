schema_version: "1"
capability_id: plugin-scientific-agent-skills-optimize-for-gpu
title: GPU Optimization for Python with NVIDIA
description: GPU-accelerate Python code using CuPy, Numba CUDA, Warp, cuDF,
  cuML, cuGraph, KvikIO, cuCIM, cuxfilter, cuVS, cuSpatial, and RAFT. Use
  whenever the user mentions GPU/CUDA/NVIDIA acceleration, or wants to speed up
  NumPy, pandas, scikit-learn, scikit-image, NetworkX, GeoPandas, or Faiss
  workloads. Covers physics simulation, differentiable rendering, mesh ray
  casting, particle systems (DEM/SPH/fluids), vector/similarity search,
  GPUDirect Storage file IO, interactive dashboards, geospatial analysis,
  medical imaging, and sparse eigensolvers. Also use when you see CPU-bound
  Python code (loops, large arrays, ML pipelines, graph analytics, image
  processing) that would benefit from GPU acceleration, even if not explicitly
  requested.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
