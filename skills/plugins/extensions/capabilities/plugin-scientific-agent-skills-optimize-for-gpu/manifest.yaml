schema_version: "1"
capability_id: plugin-scientific-agent-skills-optimize-for-gpu
title: GPU Optimization for Python with NVIDIA
description: GPU-accelerates scientific Python on NVIDIA hardware and verifies
  that the result is correct and faster. Use for CUDA/GPU optimization;
  CPU-bound NumPy, SciPy, pandas, scikit-learn, NetworkX, scikit-image,
  vector-search, image-processing, graph, simulation, or file-I/O workloads;
  CuPy, cuDF, cuML, cuGraph, cuVS, cuCIM, KvikIO, Warp, Newton, Numba-CUDA, or
  RAFT questions; and profiling, memory-transfer, kernel, or multi-GPU
  bottlenecks. Also use when large data-parallel Python code is slow and GPU
  acceleration is a plausible option, even if the user does not name CUDA.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
