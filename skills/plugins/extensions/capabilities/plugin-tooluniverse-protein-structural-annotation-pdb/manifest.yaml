schema_version: "1"
capability_id: plugin-tooluniverse-protein-structural-annotation-pdb
title: Protein structural annotation from a PDB
description: "Given a PDB structure, produce a per-residue annotation table:
  which residues sit at a binding interface (vs a partner chain), which line a
  ligand pocket, which are buried (core) vs solvent-exposed (surface), and
  optionally secondary structure. This is the structural track drawn under a DMS
  heatmap and the structural prior SAE feature drops are read against. Use when
  you need to anchor a variant-interpretation or DMS analysis to the protein's
  actual physical context."
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
