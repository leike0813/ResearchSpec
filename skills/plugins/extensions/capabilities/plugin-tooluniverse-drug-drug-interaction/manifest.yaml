schema_version: "1"
capability_id: plugin-tooluniverse-drug-drug-interaction
title: Drug-Drug Interaction Prediction & Risk Assessment
description: Assess drug-drug interactions — CYP metabolic interactions
  (substrate/inhibitor/inducer), transporter (P-gp, BCRP, OATP) effects,
  pharmacodynamic synergy/antagonism, clinical significance scoring, and
  management recommendations. Use for polypharmacy review, prescribing decision
  support, and safety analysis when adding or switching drugs.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
