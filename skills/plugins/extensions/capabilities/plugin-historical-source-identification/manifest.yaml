schema_version: "1"
capability_id: plugin-historical-source-identification
title: Historical Source Identification
description: Search, retrieve, verify, and record historical-source candidates
  through reviewed adapters with provenance-bearing evidence for one graph
  node.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: historical-source-identification-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_historical_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,query_ledger,candidate_ledger,retrieval_ledger,verification_decisions,conclusions
