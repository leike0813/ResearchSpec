capability_id: plugin-education-agent-skills-place-based-inquiry-anchor
title: Place-Based Inquiry Anchor
description: Anchor curriculum learning in a specific local place with
  connections to community, culture, and identity. Use when connecting academic
  content to students' local environment and heritage.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
