schema_version: "1"
capability_id: plugin-scientific-agent-skills-pacsomatic
title: pacsomatic
description: Operator toolkit for nf-core/pacsomatic matched tumor-normal
  workflows from BAM inputs. Use this skill when the user needs to validate run
  inputs, generate pacsomatic-compliant samplesheets, prepare reproducible
  Nextflow launch artifacts, run locally or submit to schedulers
  (LSF/Slurm/PBS/SGE), and triage execution failures. Triggers on requests to
  run pacsomatic, prepare launch commands/scripts, perform dry-run checks, or
  troubleshoot pipeline startup and scheduler submission errors.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
