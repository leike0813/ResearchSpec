capability_id: plugin-tooluniverse-population-genetics
title: Population Genetics Analysis
description: Population genetics analysis — allele frequencies (gnomAD, 1000
  Genomes), Hardy-Weinberg equilibrium testing, Fst between populations, GWAS
  associations, evolutionary constraint scores. Use for cross-population variant
  comparison, ancestry-aware allele frequency lookups, and population-level
  evolutionary analysis.
