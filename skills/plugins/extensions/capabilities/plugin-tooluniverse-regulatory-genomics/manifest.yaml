schema_version: "1"
capability_id: plugin-tooluniverse-regulatory-genomics
title: Regulatory Genomics Research Skill
description: Transcription factor binding, cis-regulatory elements (cCREs),
  chromatin accessibility, and regulatory annotation using JASPAR (motifs),
  ENCODE (cCREs, ChIP-seq), RegulomeDB (regulatory variant scoring), UCSC — plus
  sequence-based deep-learning prediction of regulatory activity and non-coding
  variant effects (AlphaGenome, Enformer, Borzoi, ChromBPNet, Evo 2). Use for
  regulatory element annotation, TF-binding-site prediction, regulatory-region
  functional impact assessment, and predicting how a non-coding variant or a raw
  DNA sequence affects expression/chromatin/accessibility. Use this whenever a
  user asks what regulates a gene, whether a SNP hits a regulatory element, or
  to predict a non-coding variant's functional effect from sequence.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
