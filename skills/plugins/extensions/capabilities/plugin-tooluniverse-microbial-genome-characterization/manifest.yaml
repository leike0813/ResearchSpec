schema_version: "1"
capability_id: plugin-tooluniverse-microbial-genome-characterization
title: Microbial Genome Assembly Characterization & QC
description: Genome-ASSEMBLY discovery, QC, and replicon mapping for any
  organism (bacteria, archaea, fungi, and beyond) using NCBI Datasets. Resolves
  an organism name or taxid to assemblies, picks the reference/representative or
  best-quality assembly, pulls assembly QC metrics (total length,
  contig/scaffold N50, contig count, GC%, assembly level, RefSeq category),
  enumerates chromosomes and plasmids via per-replicon sequence reports, and
  compares candidate assemblies on quality. Use for "what genomes are available
  for [organism]", "assembly stats / N50 / GC content for [GCF_/GCA_
  accession]", "how many plasmids does [strain] have", "compare assemblies for
  [species]", "find the reference genome for [taxon]", "is this assembly
  Complete Genome or just contigs". NOT for gene-level orthology/synteny (use
  tooluniverse-comparative-genomics), plant gene structure (use
  tooluniverse-plant-genomics), de novo assembly from raw reads (no tool
  exists), or taxonomy-only name/lineage lookups.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
