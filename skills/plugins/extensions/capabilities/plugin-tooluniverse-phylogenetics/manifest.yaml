schema_version: "1"
capability_id: plugin-tooluniverse-phylogenetics
title: Phylogenetics and Sequence Analysis
description: Phylogenetic analysis — de novo multiple sequence alignment
  (Clustal Omega/MUSCLE/MAFFT via EBI_msa_align) and neighbour-joining/UPGMA
  tree building (EBI_build_phylogenetic_tree) from your own sequences, plus tree
  analysis, treeness, saturation (PhyKIT), parsimony-informative sites,
  alignment gap analysis, DVMC, long-branch detection, BUSCO orthologs. Uses
  PhyKIT, Biopython, DendroPy. Use to align a set of sequences, build a tree
  from sequences or an alignment, or for phylogenetic tree QC, multi-gene
  phylogenomics, evolutionary-rate analysis, and comparative-genomics studies.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
