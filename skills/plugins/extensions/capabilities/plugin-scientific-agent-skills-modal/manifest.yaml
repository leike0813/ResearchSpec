schema_version: "1"
capability_id: plugin-scientific-agent-skills-modal
title: Modal
description: Modal is a serverless cloud platform for running Python on demand,
  including on-demand GPUs. Use when deploying or serving AI/ML models, running
  GPU-accelerated workloads (training, fine-tuning, inference), serving web
  endpoints, scheduling batch jobs, or scaling Python code to cloud containers
  with the Modal SDK.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
