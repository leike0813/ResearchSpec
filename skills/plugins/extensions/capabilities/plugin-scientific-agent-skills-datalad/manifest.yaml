schema_version: "1"
capability_id: plugin-scientific-agent-skills-datalad
title: DataLad
description: Retrieve, version, and publish scientific datasets with DataLad and
  git-annex, and capture computational provenance with datalad run, rerun, and
  containers-run. Use when cloning or fetching data from OpenNeuro, DANDI,
  datasets.datalad.org, or any DataLad dataset; when a file in a dataset reads
  as a broken symlink or a small pointer instead of real data; when an analysis
  needs a machine-readable record of how each output was produced so it can be
  re-executed; or when publishing a dataset to siblings such as a GitHub
  repository plus a storage remote. Also use to decide between DataLad and plain
  Git for a data-carrying repository.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
