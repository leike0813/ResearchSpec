schema_version: "1"
capability_id: plugin-scientific-agent-skills-qiime2-amplicon
title: QIIME 2 paired-end 16S amplicons
description: Processes paired-end 16S amplicon reads into QIIME 2 ASVs and
  taxonomy with retained artifact provenance. Checks paired FASTQ manifests,
  primer orientation diagnostics, predicted post-trimming overlap, sample IDs,
  runtime versions and read retention, and guides selection of compatible
  taxonomic classifiers.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
