title: Population Genetics with 1000 Genomes (IGSR)
description: Population genetics using the 1000 Genomes Project (IGSR) —
  superpopulation/population search, sample metadata, variant frequencies across
  AFR/AMR/EAS/EUR/SAS, ancestry-specific analyses. Use for ancestry comparison,
  population-aware allele frequency lookups, and 1000-Genomes-cohort-specific
  analyses (distinct from gnomAD which has different sample composition).
