schema_version: "1"
capability_id: plugin-tooluniverse-variant-predictor-dms-validation
title: Variant-effect predictor benchmarking against DMS
description: Validate a variant-effect predictor (AlphaMissense, ESM-C SAE, ESM
  logits, EVE, conservation scores, or any per-variant numeric score) against
  experimental deep mutational scanning (DMS) data. Computes per-variant
  predictor scores, splits variants into neutral vs disruptive groups by DMS
  effect, runs a Mann-Whitney U test on the predictor scores, and sweeps the
  stratification thresholds for robustness. Use when you need to know whether a
  predictor's scores track real functional disruption on a specific protein.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
