schema_version: "1"
capability_id: plugin-tooluniverse-dose-response
title: Dose-Response / Concentration-Response Analysis
description: Dose-response / concentration-response curve fitting — IC50, EC50,
  Hill slope, Emax/Emin efficacy, and relative potency from paired concentration
  vs response data (enzyme/cell assays, drug screening, agonist/antagonist
  pharmacology). Fits the 4-parameter logistic (Hill sigmoidal) model. Use when
  you have concentrations + responses and need a potency value, to compare two
  compounds' potency, or to judge curve quality. NOT for image-derived
  dose-response (use tooluniverse-image-analysis) and NOT for
  survival/regression (use tooluniverse-statistical-modeling).
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
