schema_version: "1"
capability_id: plugin-scientific-agent-skills-relsa-severity-assessment
title: RELSA severity assessment and exploratory score forecasting
description: Supports multivariate severity assessment and exploratory
  endpoint-time score forecasting for laboratory animal studies using the RELSA
  (RELative Severity Assessment) score and ARIMA-based foRcast forecasting. Use
  when combining welfare readouts — body weight or weight loss, body
  temperature, clinical or nesting scores, biomarkers, activity, heart rate,
  burrowing, wheel running — into one severity score per animal per day, when
  asking which animals are at risk of reaching a humane endpoint at a specified
  future observation time, when defining attention/danger zones or thresholds on
  a severity scale by kernel density estimation, or when reporting severity for
  a 3Rs, refinement, animal-welfare, or EU Directive 2010/63/EU
  severity-assessment context. Covers directionality ("turned" variables),
  baseline normalization, reference sets, RELSA weights, ARIMA prediction
  intervals, and RMSE/PICP/MPIW evaluation.
