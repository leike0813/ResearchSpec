schema_version: "1"
capability_id: plugin-tooluniverse-pharmacokinetics
title: Pharmacokinetic (PK) Analysis — Non-Compartmental Analysis
description: Pharmacokinetic (PK) analysis of concentration-time data —
  non-compartmental analysis (NCA) for Cmax, Tmax, AUC (0-t and 0-∞), terminal
  half-life, clearance (CL), volume of distribution (Vd), MRT, and absolute
  bioavailability (F). Also one-compartment fitting. Use when you have
  plasma/serum drug concentrations over time after a dose and need PK
  parameters, or to compute bioavailability from IV + oral AUCs. NOT for ADMET
  property prediction from structure (use tooluniverse-admet-prediction).
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
