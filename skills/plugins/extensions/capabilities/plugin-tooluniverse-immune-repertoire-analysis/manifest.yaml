schema_version: "1"
capability_id: plugin-tooluniverse-immune-repertoire-analysis
title: ToolUniverse Immune Repertoire Analysis
description: TCR/BCR repertoire analysis — V(D)J segment usage, CDR3 sequence
  diversity, clonality scoring, antigen specificity matching to IEDB,
  public-clone identification. Use for adaptive immune response
  characterization, post-treatment immune monitoring, antigen-specific clone
  tracking, and clonal-expansion analysis in immunotherapy or vaccination
  studies.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
