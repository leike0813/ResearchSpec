schema_version: "1"
capability_id: plugin-tooluniverse-epidemiological-analysis
title: Epidemiological Data Analysis
description: End-to-end observational epidemiology analysis — from research
  question (PECO Population/Exposure/Comparator/Outcome) to publication-ready
  statistical report. Covers cohort/case-control/cross-sectional design,
  regression with confounders, propensity scoring, sensitivity analysis. Writes
  Python code for every step. Use for epidemiology study analysis,
  NHANES/UK-Biobank-style analyses.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/tooluniverse/tooluniverse-epidemiological-analysis/SKILL.md
      sha256: f34e93bd791331fb9fb2aad98e9177dafae99e0a62c03c2c05668cc2a526ab87
