schema_version: "1"
capability_id: plugin-financial-statement-analysis
title: Financial Statement Analysis
description: Normalizes statement records and produces an evidence-backed financial
  statement analysis brief with deterministic calculations.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: statement-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_financial_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,normalized_statements,metrics,conclusions
