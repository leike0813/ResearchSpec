schema_version: "1"
capability_id: plugin-tooluniverse-epigenomics-chromatin
title: Epigenomics and Chromatin Accessibility Research
description: Histone-modification ChIP-seq, ATAC-seq accessibility, chromatin
  state, and TF binding analysis from ENCODE, Roadmap Epigenomics, ChIP-Atlas.
  Use for chromatin-state-by-tissue queries, TF-binding-by-region, regulatory
  landscape mapping, and ENCODE-cCRE annotations. For DNA methylation use
  tooluniverse-epigenomics; for RNA-seq use tooluniverse-rnaseq-deseq2.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
