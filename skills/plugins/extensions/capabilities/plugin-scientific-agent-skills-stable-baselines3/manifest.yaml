schema_version: "1"
capability_id: plugin-scientific-agent-skills-stable-baselines3
title: Stable Baselines3
description: Production-ready reinforcement learning algorithms (PPO, SAC, DQN,
  TD3, DDPG, A2C) with scikit-learn-like API. Use for standard RL experiments,
  quick prototyping, and well-documented algorithm implementations. Best for
  single-agent RL with Gymnasium environments. For high-performance parallel
  training, multi-agent systems, or custom vectorized environments, use
  pufferlib instead.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
