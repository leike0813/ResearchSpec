schema_version: "1"
capability_id: plugin-scientific-agent-skills-geomaster
title: GeoMaster
description: Supports geospatial research workflows for remote sensing, vector
  and raster GIS, spatial statistics, terrain and network analysis, and machine
  learning for Earth observation. Use when processing satellite imagery,
  aligning coordinate systems and raster grids, accessing STAC catalogs,
  analyzing geospatial time series, or implementing scientific GIS workflows in
  Python, R, Julia, JavaScript, C++, Java, Go, or Rust.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
