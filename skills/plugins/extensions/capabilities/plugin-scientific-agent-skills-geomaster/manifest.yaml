schema_version: "1"
capability_id: plugin-scientific-agent-skills-geomaster
title: GeoMaster
description: Comprehensive geospatial science skill covering remote sensing,
  GIS, spatial analysis, machine learning for earth observation, and 30+
  scientific domains. Supports satellite imagery processing (Sentinel, Landsat,
  MODIS, SAR, hyperspectral), vector and raster data operations, spatial
  statistics, point cloud processing, network analysis, cloud-native workflows
  (STAC, COG, Planetary Computer), and 8 programming languages (Python, R,
  Julia, JavaScript, C++, Java, Go, Rust) with 500+ code examples. Use for
  remote sensing workflows, GIS analysis, spatial ML, Earth observation data
  processing, terrain analysis, hydrological modeling, marine spatial analysis,
  atmospheric science, and any geospatial computation task.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
