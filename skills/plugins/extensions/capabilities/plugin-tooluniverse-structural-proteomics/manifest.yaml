schema_version: "1"
capability_id: plugin-tooluniverse-structural-proteomics
title: Structural Proteomics for Drug Target Validation
description: Structural biology plus proteomics integration for drug target
  validation. Combines PDB experimental structures, AlphaFold predictions,
  GPCRdb, SAbDab antibody structures, ProteinsPlus binding-site prediction, and
  BindingDB ligand-affinity data. Use for druggability assessment, binding-site
  characterization, ligand-pocket analysis, structural-confidence scoring
  (resolution, pLDDT), and antibody-target interface analysis.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
