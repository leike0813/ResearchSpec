schema_version: "1"
capability_id: plugin-tooluniverse-gpcr-structural-pharmacology
title: GPCR and Structural Pharmacology Research
description: GPCR receptor pharmacology —
  agonist/antagonist/inverse-agonist/biased-agonist classification, GPCRdb
  structural data, receptor-ligand binding analysis, antibody-target interface
  (SAbDab). Use for GPCR drug discovery, biased-agonism analysis, receptor
  subtype selectivity questions, and orthosteric vs allosteric pocket
  characterization.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
