schema_version: "1"
capability_id: plugin-scientific-agent-skills-protocolsio-integration
title: Protocols.io Integration
description: Integration with protocols.io API for managing scientific
  protocols. This skill should be used when working with protocols.io to search,
  create, update, or publish protocols; manage protocol steps and materials;
  handle discussions and comments; organize workspaces; upload and manage files;
  or integrate protocols.io functionality into workflows. Applicable for
  protocol discovery, collaborative protocol development, experiment tracking,
  lab protocol management, and scientific documentation.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
