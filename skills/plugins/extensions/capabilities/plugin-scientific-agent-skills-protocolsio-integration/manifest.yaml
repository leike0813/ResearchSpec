schema_version: "1"
capability_id: plugin-scientific-agent-skills-protocolsio-integration
title: protocols.io Integration
description: Read, validate, and safely export protocols.io data with current
  official REST/MCP contracts, or create non-executing mutation plans. The
  bundled client makes bounded official-host GET requests only with explicit
  --execute. Use only for tasks explicitly targeting protocols.io or an exact
  protocols.io protocol version.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
