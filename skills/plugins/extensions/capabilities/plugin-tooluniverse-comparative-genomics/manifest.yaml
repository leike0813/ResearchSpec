schema_version: "1"
capability_id: plugin-tooluniverse-comparative-genomics
title: Comparative Genomics & Ortholog Analysis
description: Cross-species gene comparison and ortholog analysis. Integrates
  Ensembl Compara orthologs, NCBI Gene, UniProt, OLS, Monarch, and OpenTargets
  to identify orthologs, paralogs, sequence conservation, functional
  conservation across species, and lineage-specific gene gains/losses. Use for
  phylogenetic gene tracing, model-organism mapping, and evolutionary-genomics
  queries.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
