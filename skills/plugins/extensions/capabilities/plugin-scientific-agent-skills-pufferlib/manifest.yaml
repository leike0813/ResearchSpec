schema_version: "1"
capability_id: plugin-scientific-agent-skills-pufferlib
title: PufferLib
description: Version-aware guidance for PufferLib reinforcement-learning
  environments, vectorization, policies, PuffeRL training, evaluation, and safe
  checkpoint review. Use when adapting Gymnasium/PettingZoo environments to
  published PufferLib 3.0.0 or working with the redesigned native 4.0 source
  line.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
