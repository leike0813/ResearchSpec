schema_version: "1"
capability_id: plugin-tooluniverse-pathway-disease-genetics
title: "Pathway-Disease Genetics: GWAS to Drug Targets via Pathways"
description: Connect GWAS variants to biological pathways and druggable targets.
  Maps GWAS hits to causal genes (via fine-mapping/eQTL), then to pathways
  (Reactome, KEGG, WikiPathways), then to existing drugs hitting those pathways.
  Use for pathway-level disease mechanisms, druggable-pathway prioritization
  from GWAS, SNP-to-pathway-to-target tracing, and tissue-specific eQTL evidence
  for drug target hypotheses.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
