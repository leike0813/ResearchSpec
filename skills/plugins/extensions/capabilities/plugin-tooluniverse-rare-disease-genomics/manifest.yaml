schema_version: "1"
capability_id: plugin-tooluniverse-rare-disease-genomics
title: Rare Disease Genomics Research
description: Rare disease genomics — disease identification (Orphanet),
  causative gene discovery, gene-disease validity (GenCC), variant
  interpretation (ClinVar), and translational research (ClinicalTrials.gov, drug
  repurposing for orphans). Use for rare-disease-gene curation,
  novel-gene-discovery analysis, and rare-disease drug-development support.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
