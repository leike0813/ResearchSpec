schema_version: "1"
capability_id: plugin-tooluniverse-gwas-study-explorer
title: GWAS Study Deep Dive & Meta-Analysis
description: Compare GWAS studies, perform meta-analyses across cohorts, and
  assess signal replication. Uses GWAS Catalog metadata, study-level statistics,
  and cross-cohort comparison. Use for evaluating GWAS reproducibility for a
  trait, meta-analysis sample size and effect-size aggregation, and detecting
  study heterogeneity (population, design, ancestry).
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
