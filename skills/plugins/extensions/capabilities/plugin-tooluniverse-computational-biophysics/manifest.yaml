schema_version: "1"
capability_id: plugin-tooluniverse-computational-biophysics
title: Computational Biophysics & Quantitative Biology Skill
description: Solve quantitative problems in biophysics — pharmacokinetics (PK
  volume of distribution, clearance, half-life), epidemiology (R0, attack rate),
  toxicology (LD50, NOAEL), population genetics (Hardy-Weinberg, Fst), enzyme
  kinetics (Michaelis-Menten), thermodynamics. Use for first-principles
  quantitative biology calculations, dose calculations, exposure assessment, and
  biophysical-property estimation.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
