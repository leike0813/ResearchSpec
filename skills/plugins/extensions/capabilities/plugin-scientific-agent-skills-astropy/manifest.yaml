capability_id: plugin-scientific-agent-skills-astropy
title: Astropy
description: Core Python library for astronomy and astrophysics workflows that
  need Astropy APIs, including units/quantities, coordinates, FITS I/O, tables,
  time systems, WCS, and cosmology. Use when implementing or debugging
  astronomical data analysis code with Astropy.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
