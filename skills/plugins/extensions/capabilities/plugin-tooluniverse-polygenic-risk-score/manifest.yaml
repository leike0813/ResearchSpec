schema_version: "1"
capability_id: plugin-tooluniverse-polygenic-risk-score
title: Polygenic Risk Score (PRS) Builder
description: Build and interpret polygenic risk scores (PRS) for complex
  diseases using GWAS summary statistics. Covers PRS construction
  (clumping/thresholding, PRS-CS), validation in independent cohorts,
  ancestry-aware adjustment, and clinical interpretation (population-relative
  risk, not absolute prediction). Use for PRS-based risk stratification.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
