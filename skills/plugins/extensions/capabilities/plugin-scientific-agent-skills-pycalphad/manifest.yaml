capability_id: plugin-scientific-agent-skills-pycalphad
title: "pycalphad: TDB equilibrium calculations"
description: Computes finite-temperature CALPHAD equilibria, phase fractions,
  and phase compositions from thermodynamic TDB databases using pycalphad. Use
  for alloy phase stability, equilibrium temperature sweeps, tie lines,
  lever-rule checks, or reproducible phase-fraction calculations with explicit
  components and mole-fraction conditions.
