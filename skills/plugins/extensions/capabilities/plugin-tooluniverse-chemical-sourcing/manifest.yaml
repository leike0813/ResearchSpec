schema_version: "1"
capability_id: plugin-tooluniverse-chemical-sourcing
title: Chemical Compound Sourcing & Procurement
description: Find commercial sources for chemical compounds — PubChem/ChEMBL
  identity resolution then vendor catalog search across ZINC, Enamine,
  eMolecules, Mcule. Compares pricing, availability, and identifies purchasable
  analogs when an exact compound is not in stock. Use for chemical procurement,
  virtual library curation, and 'where can I buy X' questions for synthesis
  planning.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
