schema_version: "1"
capability_id: plugin-tooluniverse-drug-target-validation
title: Drug Target Validation Pipeline
description: Quantitative drug-target validation pipeline. Scores druggability,
  selectivity, safety profile, ADMET feasibility, and structural tractability
  with a composite Target Validation Score (0-100) and GO/NO-GO recommendation.
  Use for go/no-go decisions on a target before commit-to-medchem, target
  prioritization across a list, and target-deselection rationale.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
