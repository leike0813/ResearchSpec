schema_version: "1"
capability_id: plugin-tooluniverse-gwas-trait-to-gene
title: GWAS Trait-to-Gene Discovery
description: Discover causal genes for diseases/traits from GWAS data using Open
  Targets L2G (locus-to-gene) scoring — integrates eQTL, chromatin interaction,
  and distance evidence. Use for trait-to-gene mapping, drug-target hypothesis
  generation from GWAS, and replacing the 'nearest gene' heuristic with
  multi-evidence L2G scores.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
