schema_version: "1"
capability_id: plugin-tooluniverse-ecology-biodiversity
title: Ecology & Biodiversity Research
description: Ecology, biodiversity, and conservation biology research — species
  identification (GBIF, NCBI Taxonomy), invasive species impact, ecosystem
  dynamics, conservation status (IUCN), niche ecology. Use for biodiversity
  questions, species comparison, invasion biology, conservation prioritization,
  and ecology-related literature search.
maturity: operational
class: analysis
node_kind: producer
