schema_version: "1"
capability_id: plugin-tooluniverse-regulatory-variant-analysis
title: Regulatory Variant Analysis Skill
description: Non-coding/regulatory variant interpretation — GWAS association
  lookup, eQTL evidence (GTEx), chromatin state (ENCODE), regulatory variant
  scoring (RegulomeDB, CADD), and TF-binding disruption. Use for non-coding GWAS
  hit interpretation, eQTL-based gene assignment, and regulatory mechanism
  reasoning. Distinct from coding-variant tools.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
