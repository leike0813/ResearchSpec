schema_version: "1"
capability_id: plugin-tooluniverse-microbiome-research
title: Microbiome Research with ToolUniverse
description: Microbiome research using MGnify, GTDB, ENA, OLS (ENVO biomes), and
  EuropePMC. Covers study discovery, taxonomic profiling, host-microbe
  interaction analysis, and biome-by-condition queries. Use for microbiome study
  selection, organism-environment associations, and clinical-microbiome
  literature review. Distinct from analytical workflow (use
  tooluniverse-metagenomics-analysis for that).
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/tooluniverse/tooluniverse-microbiome-research/SKILL.md
      sha256: f0ec14fc489d25d35bfeb3b47499124aa73018a6455f11a4345d1efa1d8f1e40
