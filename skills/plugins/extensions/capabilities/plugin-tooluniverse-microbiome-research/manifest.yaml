schema_version: "1"
capability_id: plugin-tooluniverse-microbiome-research
title: Microbiome Research with ToolUniverse
description: Microbiome research using MGnify, GTDB, ENA, OLS (ENVO biomes),
  EuropePMC, BacDive (strain phenotypes), MediaDive (growth media recipes), and
  GMrepo (gut microbiome disease-association counts). Covers study discovery,
  taxonomic profiling, host-microbe interaction analysis, biome-by-condition
  queries, strain culturing requirements, and phenotype/disease prevalence
  lookups. Use for microbiome study selection, organism-environment
  associations, clinical-microbiome literature review, and "how do I grow this
  organism" / "how prevalent is this species in condition X" questions. Distinct
  from analytical workflow (use tooluniverse-metagenomics-analysis for that).
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
