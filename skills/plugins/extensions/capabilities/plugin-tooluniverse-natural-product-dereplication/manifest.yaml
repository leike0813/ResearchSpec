schema_version: "1"
capability_id: plugin-tooluniverse-natural-product-dereplication
title: Natural Product Dereplication & Chemotaxonomy
description: Dereplicate a putative natural product and assign its chemical
  taxonomy. Use to answer "is [compound] a known natural product", "what
  microbe/organism produces [compound]", "what chemical class is [compound]",
  "dereplicate this metabolite (by formula/exact mass/InChIKey/SMILES)", or
  "classify this molecule into ChemOnt". Searches NPAtlas for known microbial
  natural products (producing organism + literature reference), assigns the
  ChemOnt kingdom→superclass→class→subclass hierarchy via ClassyFire, resolves
  systematic IUPAC names to structure via OPSIN, and cross-references identity
  in PubChem. NOT for general drug/compound identity or ADMET (use
  tooluniverse-chemical-compound-retrieval /
  tooluniverse-small-molecule-discovery) and NOT for metabolomics
  pathway/enrichment analysis (use tooluniverse-metabolomics skills).
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
