schema_version: "1"
capability_id: plugin-education-agent-skills-panel-review
title: What This Skill Does
description: Seven-role depersonalised panel review of framework artefacts (KUD,
  criterion bank, LT definition, crosswalk, scope-and-sequence) in
  sequential-isolation mode. Gate rule mean>=88 AND no role<70.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: education-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_education_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/education-agent-skills/education-agent-skills-panel-review/SKILL.md
      sha256: 9167a69ca9cf81dd0aafae02d48ea73e9c2a79b417bf49fd6b7c84494597bc9f
