schema_version: "1"
capability_id: plugin-scientific-agent-skills-pylabrobot
title: PyLabRobot
description: Develop and review PyLabRobot lab-automation resources,
  liquid-handling plans, offline simulations, and supported-device integrations.
  Use for PyLabRobot protocols or API questions; keep physical execution behind
  an explicit operator safety gate.
maturity: operational
class: analysis
node_kind: producer
execution_type: mixed
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
