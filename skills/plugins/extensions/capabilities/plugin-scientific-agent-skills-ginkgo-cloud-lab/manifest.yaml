schema_version: "1"
capability_id: plugin-scientific-agent-skills-ginkgo-cloud-lab
title: Ginkgo Cloud Lab
description: Submit and manage protocols on Ginkgo Bioworks Cloud Lab
  (cloud.ginkgo.bio), a web-based interface for autonomous lab execution on
  Reconfigurable Automation Carts (RACs). Use when the user wants to run protein
  expression and purification (cell-free, E. coli, or Pichia), HiBiT or A280 or
  LabChip quantification, IVT mRNA/circRNA synthesis, thermal shift /
  developability assays, Echo-MS enzyme or analyte methods, SPR target
  onboarding, fluorescent pixel art, or otherwise interact with Ginkgo Cloud Lab
  services. Covers protocol selection, input preparation, pricing, and ordering
  workflows.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
