schema_version: "1"
capability_id: plugin-scientific-agent-skills-ginkgo-cloud-lab
title: Cloud Laboratory Service Assessment
description: Compares research service categories and prepares an advisory
  checklist for quote assumptions, material permissions, evidence deliverables,
  and scientific acceptance.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
provenance:
  origin: vendor-derived
  upstream_sources:
    - path: skills/plugins/vendors/scientific-agent-skills/scientific-agent-skills-ginkgo-cloud-lab/SKILL.md
      sha256: 5aa0ec7713f1819048e492065561e1f29401afa76b41cfa6324515bd93739afd
