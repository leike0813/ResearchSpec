schema_version: "1"
capability_id: plugin-tooluniverse-gene-disease-association
title: Gene-Disease Association Analysis
description: Gene-disease association analysis across DisGeNET, OpenTargets,
  Monarch, OMIM, GenCC, Orphanet, Gene2Phenotype (G2P). Cross-references
  multiple sources for evidence-graded association reports with concordance
  scoring (5/5 sources agree → strong, 1/5 → weak). Use for 'which diseases is
  gene X associated with' or 'which genes cause disease Y' queries with
  quantitative confidence, including clinical-panel-based curation
  (developmental disorders, cancer, cardiac, skeletal, eye, skin panels).
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: tooluniverse-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_tooluniverse_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
knowledge_refs: []
gate_policy: advisory
