schema_version: "1"
capability_id: plugin-scientific-agent-skills-matlab
title: MATLAB/Octave Scientific Computing
description: MATLAB and GNU Octave numerical computing for matrix operations,
  data analysis, visualization, and scientific computing. Use when writing
  MATLAB/Octave scripts for linear algebra, signal processing, image processing,
  differential equations, optimization, statistics, or creating scientific
  visualizations. Also use when the user needs help with MATLAB syntax,
  functions, or wants to convert between MATLAB and Python code. Scripts can be
  executed with MATLAB or the open-source GNU Octave interpreter.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
