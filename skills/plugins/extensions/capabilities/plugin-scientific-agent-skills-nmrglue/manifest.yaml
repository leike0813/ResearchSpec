capability_id: plugin-scientific-agent-skills-nmrglue
title: "nmrglue: calibrated 1D FID processing"
description: Processes calibrated one-dimensional complex NMR free-induction
  decays with nmrglue into phased spectra, peak candidates, and signed
  integration regions. Use for raw 1D NMR processing, ppm-axis verification,
  apodization, Fourier transformation, manual phasing, baseline correction, or
  reproducible spectral integration.
