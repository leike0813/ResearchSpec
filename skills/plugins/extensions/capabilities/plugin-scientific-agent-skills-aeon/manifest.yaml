schema_version: "1"
capability_id: plugin-scientific-agent-skills-aeon
title: Aeon Time Series Machine Learning
description: This skill should be used for time series machine learning tasks
  including classification, regression, clustering, forecasting, anomaly
  detection, segmentation, and similarity search. Use when working with temporal
  data, sequential patterns, or time-indexed observations requiring specialized
  algorithms beyond standard ML approaches. Particularly suited for univariate
  and multivariate time series analysis with scikit-learn compatible APIs.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
params: {}
inputs:
  - role: task_request
    schema_ref: plugin-task.v1
    required: true
    source_policy: handoff
outputs:
  - role: research_brief
    schema_ref: plugin-result.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - task_request
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: scientific-brief-validator
    kind: script
    inputs:
      - task_request
    outputs:
      - research_brief
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/validate_scientific_brief.py
        - --submission
        - "{outputs_json}"
        - --required
        - scope,source_ledger,method_plan,work_products,validation_results,conclusions
