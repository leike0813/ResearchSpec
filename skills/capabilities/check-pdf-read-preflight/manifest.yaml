schema_version: "1"
capability_id: check-pdf-read-preflight
title: PDF Read Preflight
description: Deterministic PDF extraction preflight with a separate content advisory.
maturity: operational
class: verification
node_kind: checker
execution_type: script
params: {}
inputs:
  - role: pdf_path
    schema_ref: pdf.v1
    required: true
    source_policy:
      - handoff
      - node_output
outputs:
  - role: pdf_preflight_report
    schema_ref: pdf-preflight.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - pdf_path
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: pdf-read-preflight-script
    kind: script
    inputs:
      - pdf_path
    outputs:
      - pdf_preflight_report
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/pdf-read-preflight.py
        - pdf
        - "{outputs_json}"
knowledge_refs:
