    schema_ref: manuscript-draft.v1
    required: true
    source_policy:
      - handoff
      - node_output
  - role: timeline
    schema_ref: timeline.v1
    required: false
    source_policy:
      - handoff
      - node_output
  - role: citation_provenance
    schema_ref: citation-provenance.v1
