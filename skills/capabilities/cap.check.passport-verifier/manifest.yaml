schema_version: "1"
capability_id: cap.check.passport-verifier
title: Passport Verifier
description: Deterministic material passport verifier.
class: verification
node_kind: checker
execution_type: script
params: {}
inputs:
  - role: material_passport
    schema_ref: material-passport.v1
    required: true
    source_policy: node_output
outputs:
  - role: passport_report
    schema_ref: passport-check.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - material_passport
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: passport-verifier-script
    kind: script
    inputs:
      - material_passport
    outputs:
      - passport_report
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/passport-verifier.py
        - "{outputs_json}"
knowledge_refs: []
gate_policy: required
provenance:
  origin: ars-derived
  extraction_artifact_ids:
    - CAP-M5-10
