<body>
<header><div><div class="eyebrow">论文修订 · 工件台账</div><h1 id="title">论文修订工作台</h1><div id="identity" class="small muted"></div></div><div class="header-meta"><span id="counts" class="tag"></span><button class="primary" id="export">导出审阅结果</button></div></header>
<nav id="stages" aria-label="审阅阶段"></nav>
<div id="notice"><div><div class="statline" id="scope-description"></div><div id="context" class="small muted"></div></div><div><p id="message" class="small" role="status" aria-live="polite"></p><p id="storage-status" class="small" role="status"></p></div></div>
<div class="workspace">
<aside class="rail panel" aria-label="审稿意见"><h2>审稿意见</h2><p class="small muted">点选意见，核对原文与修订事项。</p><details class="filters"><summary>搜索与筛选</summary><label>搜索<input id="search" type="search"></label><label>审稿人<select id="reviewer"><option value="">全部</option></select></label><label>意见状态<select id="status"><option value="">全部</option></select></label></details><div id="objects"></div><details><summary>完整冻结文档目录</summary><div id="documents"></div></details></aside>
<main class="column"><div id="guide" class="task-guide"></div><section class="panel"><h2 id="object-heading" tabindex="-1"></h2><div id="candidate"></div></section><details class="panel" id="reading-panel"><summary>查看关联稿件片段与完整文档</summary><div id="reading-mode"></div><div id="reading"></div><div id="selection-tools" hidden><span id="selection-quote"></span><button id="add-selection">批注所选文字</button><button id="cancel-selection">取消</button></div></details></main>
<aside class="column side-column"><section class="panel context-panel"><h2>当前意见与稿件</h2><div id="trace"></div></section><section class="panel review-panel" aria-label="审阅反馈"><div class="panel-head"><h2>我的反馈</h2><span id="feedback-target" class="tag"></span></div><div id="focus-note" class="small focus-note" hidden></div><div class="feedback"><label>这项建议如何处理？<select id="disposition"></select></label><label>批注或调整建议<textarea id="request-note" placeholder="写明遗漏、证据问题或修改建议"></textarea></label><button id="save-request">保存处置与建议</button><div id="confirm-area"></div><div id="draft-status" class="status"></div></div><p class="small muted">交回助手核对后继续。正式决定在对话中确认。</p><details class="feedback-extra" id="additional-feedback"><summary>独立批注、整体说明与其他反馈对象</summary><label>反馈对象<select id="target"></select></label><label>独立批注<textarea id="annotation-note"></textarea></label><button id="add-object-note">添加对象批注</button><div class="actions"><button id="focus-request">请求切换执行焦点</button></div><label>整体说明<textarea id="overall"></textarea></label><button id="save-overall">保存整体说明</button></details><details class="feedback-extra"><summary>已记录反馈</summary><div id="feedback-list"></div></details></section></aside>
</div>
<script type="application/json" id="revision-master-data">__REVISION_MASTER_DATA__</script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let w;
  try { w = JSON.parse($('revision-master-data').textContent); }
  catch { $('message').textContent = '请打开 Agent 已准备好的审阅 HTML。'; $('export').disabled = true; return; }

  const b = w.business, stageNames = {coverage:'意见覆盖',board:'整体工作板',strategy:'当前策略',round:'本轮改稿与回复'};

  const labels = {comment_id:'意见',thread_id:'原始条目',reviewer_id:'审稿人',canonical_summary:'意见摘要',required_action:'所需行动',original_text:'原文',normalized_summary:'整理摘要',source_type:'来源类型',source_document_id:'原始文档',source_kind:'文档类型',source_label:'来源',source_path:'源文件',span_role:'来源作用',start_offset:'原文起点',end_offset:'原文终点',span_text:'原文片段',excerpt_text:'引文',note:'说明',coverage_status:'覆盖状态',segment_text:'覆盖片段',status:'状态',priority:'优先级',evidence_gap:'证据缺口',user_confirmation_needed:'需要用户确认',next_action:'下一步',target_location:'稿件位置',location_role:'位置作用',manuscript_claim_or_section:'论点或章节',existing_evidence:'现有证据',gap_summary:'缺口',dependency_comment_id:'依赖意见',proposed_stance:'拟定立场',stance_rationale:'立场理由',manuscript_change:'稿件修改',expected_response_letter_effect:'回复预期',required_material:'所需材料',available_now:'当前可用',gap_note:'缺口说明',message:'待核对事项',category:'类别',content_text:'候选措辞',rationale:'理由',target_scope_note:'适用范围',draft_text:'回复草案',request_summary:'补材建议',request_recommendation:'接收建议',round_id:'轮次',file_path:'材料文件',concern_summary:'材料事项',decision:'接收判断',decision_rationale:'判断理由',planned_usage_note:'使用计划',manuscript_execution_items_done:'稿件草案完成',response_draft_done:'回复完成',evidence_gap_closed:'证据缺口关闭',user_strategy_confirmed:'内部策略确认',one_to_one_link_checked:'对应已核对',export_ready:'导出就绪',plan_action_id:'计划行动',execution_category:'行动类别',title:'行动',objective:'目标',suggested_change:'修改建议',evidence_requirement:'证据要求',depends_on_plan_action_id:'依赖行动',log_id:'修改日志',operator_role:'执行者',summary:'摘要',change_note:'修改说明',response_note:'回复说明',created_at:'记录时间',target_file:'目标文件',target_locator:'位置',change_type:'修改类型',change_summary:'修改摘要',evidence_source:'证据来源',expected_response_use:'回复用途',relative_path:'文件',change_kind:'文件变化',diff_excerpt:'变化摘要',before_excerpt:'修改前',after_excerpt:'修改后',snapshot_sha256:'冻结文件标识',last_audited_sha256:'已核对文件标识',current_sha256:'当前文件标识',last_log_id:'最近日志',variant_label:'措辞版本',variant_text:'候选措辞',response_resolution_kind:'回复方式',original_comment:'原始意见',modification_scope:'修改范围',key_revision_excerpt:'修改引文',response_explanation:'回复解释',latex_excerpt:'LaTeX 引文',latex_response_text:'LaTeX 回复',artifact_name:'交付件',artifact_status:'记录状态',output_path:'交付路径',profile_target:'风格对象',profile_summary:'风格摘要',anti_ai_focus:'措辞关注点',rule_type:'规则类别',rule_text:'规则',main_entry:'稿件入口',project_shape:'稿件结构',high_risk_areas:'高风险范围',section_title:'章节',purpose_in_manuscript:'章节用途',key_files_or_locations:'文件位置',core_claim:'主要论点',main_evidence:'主要证据',supporting_section_ids:'支持章节',risk_level:'风险',link_note:'关联说明',response_role:'回复作用',patch_set_id:'交付修改组',artifact_kind:'交付类型',source_root:'原稿目录',output_root:'交付目录',operation:'操作',anchor_text:'定位引文',marked_text:'标记稿',clean_text:'净稿',notes:'说明'};
  const categories = ['dispositions','annotations','confirmations','seen','focus_requests','overall_note'];
  const categoryNames = {dispositions:'处置与请求',annotations:'独立批注',confirmations:'内部确认',seen:'本轮已看完',focus_requests:'切换焦点请求',overall_note:'整体说明'};
  const id = () => crypto.randomUUID();
  const empty = () => Object.fromEntries(categories.map(key => [key, []]));
  const key = `revision-master:${w.workspace_id}:${w.snapshot_id}`;
  let draft = {draft_id:id(),export_revision:0,feedback:empty()}, stage = w.context.stage;
  let selected = w.context.active_comment_id ? `comment:${w.context.active_comment_id}` : (b.atomic_comments[0] ? `comment:${b.atomic_comments[0].comment_id}` : 'scope:coverage');
  let atomListOpen = false, selectedThread = rowsForInitialThread();
  function rowsForInitialThread() { return b.raw_thread_atomic_links.find(row => selected === 'comment:'+row.comment_id)?.thread_id || b.raw_review_threads[0]?.thread_id || null; }
  let reading = {mode:'related',document_id:null,start:0}, selectionAnchor = null, coverageDocumentId = null;
  const docs = new Map(w.documents.map(doc => [doc.document_id,doc]));
  const blocks = new Map(w.documents.flatMap(doc => doc.blocks.map(block => [block.id,block])));
  const scopes = new Map(w.scopes.map(scope => [scope.scope_id,scope]));
  const comments = new Map(b.atomic_comments.map(row => [row.comment_id,row]));
  const threads = new Map(b.raw_review_threads.map(row => [row.thread_id,row]));
  const rows = (table,field,value) => (b[table] || []).filter(row => row[field] === value);

  $('cancel-selection').addEventListener('click',() => { selectionAnchor = null; $('selection-tools').hidden = true; window.getSelection()?.removeAllRanges(); });
  $('add-object-note').addEventListener('click',() => addAnnotation(null));
  $('save-request').addEventListener('click',() => {
    const action = $('disposition').value, note = $('request-note').value.trim(), target = targetForFeedback();
    if (!action) { draft.feedback.dispositions = draft.feedback.dispositions.filter(row => row.target_id !== target); save(); tell('已清除该对象处置。'); return; }
    if (action === 'adjust' && !note) { put('dispositions',{...entry(target,''),action:'defer'}); tell('请写明调整内容；这项建议暂待核对。'); $('request-note').focus(); return; }
    put('dispositions',{...entry(target,note),action}); tell('已保存处置与请求。');
  });
  $('disposition').addEventListener('change',() => $('save-request').click());
  $('request-note').addEventListener('input',() => {
    const note = $('request-note').value.trim(), target = targetForFeedback();
    if (!note) { const prior = draft.feedback.dispositions.find(row => row.target_id === target); if (prior) { if (prior.action === 'adjust') draft.feedback.dispositions = draft.feedback.dispositions.filter(row => row !== prior); else prior.note = ''; save(); } return; }
    const action = $('disposition').value || 'defer';
    if (!$('disposition').value) $('disposition').value = action;
    put('dispositions',{...entry(target,note),action});
  });
  $('save-overall').addEventListener('click',() => { const scope = currentScope(), note = $('overall').value.trim(); if (!note) { draft.feedback.overall_note = draft.feedback.overall_note.filter(row => row.scope_id !== scope.scope_id); save(); } else put('overall_note',{...entry(`scope:${scope.scope_id}`,note),scope_id:scope.scope_id,target_id:`scope:${scope.scope_id}`}); tell('已保存整体说明。'); });
  $('focus-request').addEventListener('click',() => { if (selected.startsWith('comment:')) { put('focus_requests',entry(selected,`请评估切换执行焦点到 ${selected.slice(8)}`)); tell('已记录焦点请求；当前执行焦点未改变。'); } });
  $('target').addEventListener('change',loadRequest);
  for (const filter of ['search','reviewer','status']) $(filter).addEventListener(filter === 'search' ? 'input' : 'change',renderObjects);
  function exportResult() {
    removeBlockedConfirmations();
    const feedback = structuredClone(draft.feedback), result = {schema_version:'revision-master-review-result.v1',workspace:w,snapshot_id:w.snapshot_id,result_id:id(),draft_id:draft.draft_id,export_revision:draft.export_revision+1,exported_at:new Date().toISOString(),feedback};
    const entries = categories.flatMap(category => feedback[category]);
    if (entries.some(row => !validEntry(row)) || new Set(entries.map(row => row.feedback_id)).size !== entries.length) { tell('反馈引用无法核对，请交回 Agent 检查。'); return; }
    for (const row of feedback.annotations) if (row.anchor) { const block = blocks.get(row.anchor.block_id); if (!block || row.anchor.snapshot_id !== w.snapshot_id || (row.anchor.kind === 'text' ? block.text.slice(row.anchor.start,row.anchor.end) !== row.anchor.exact_quote : block.text !== row.anchor.exact_quote)) { tell('批注锚点无法核对，请交回 Agent。'); return; } }
    const url = URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})), anchor = el('a'); anchor.href = url; anchor.download = `revision-master-${w.snapshot_id}-${result.export_revision}.json`; document.body.append(anchor); anchor.click(); anchor.remove(); setTimeout(() => URL.revokeObjectURL(url),1000); draft.export_revision = result.export_revision; save(); tell('已导出完整结果，请交回 Agent。');
  }
  $('export').addEventListener('click',exportResult);
  function renderStages() {
    $('stages').replaceChildren();
    const stages = {coverage:['01 · 核对审稿意见','原文、拆分与遗漏'],board:['02 · 安排修订工作','优先级、证据与位置'],strategy:['03 · 确认逐项策略','修改动作与所需材料'],round:['04 · 核对修改和回复','稿件改动与回复覆盖']};
    for (const [value,[title,hint]] of Object.entries(stages)) { const item = button('',() => { stage = value; renderStages(); renderCandidate(); renderReading(); renderTarget(); }); item.append(el('b',title),el('small',hint)); item.setAttribute('aria-pressed',String(stage === value)); $('stages').append(item); }
  }
  $('title').textContent = w.title; document.title = w.title;
  $('identity').textContent = `任务 ${w.context.task_id} · ${w.context.round_id ? `第 ${w.context.round_id} 轮` : '准备阶段'} · 冻结审阅件`;
  $('context').textContent = `正式状态：${w.context.formal_status}。执行焦点：${w.context.active_comment_id ? shortComment(w.context.active_comment_id) : '未知'}。交接：${stageNames[w.context.stage]}。`;
  $('counts').textContent = b.raw_review_threads.length+' 条原始意见 · '+b.atomic_comments.length+' 项修订';
  fillFilters(); renderStages(); renderObjects(); renderDirectory(); renderCandidate(); renderReading(); renderTarget(); removeBlockedConfirmations(); renderFeedback();
})();
</script>
</body>
