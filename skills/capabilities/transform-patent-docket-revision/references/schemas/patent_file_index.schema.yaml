schema_version: "1"
title: Patent ordinary-file index
description: >-
  A portable index that names ordinary project files and their evidence limits
  for any patent stage. Indexes never own ResearchSpec run, node, Gate, or
  Decision state.
type: object
required: [schema_version, kind, files, limitations, metadata]
additionalProperties: false
properties:
  schema_version:
    const: "1"
  kind:
    enum: [case, corpus, disclosure, application, notes, response]
  files:
    type: array
    minItems: 1
    items:
      type: object
      required: [role, path]
      additionalProperties: false
      properties:
        role:
          type: string
          description: Stage-specific material role, unique within the index.
        path:
          type: string
          description: >-
            Project-relative POSIX path resolved inside the project root and
            outside researchspec/.
  limitations:
    type: array
    items:
      type: string
    description: Evidence limits that stay visible with the indexed materials.
  metadata:
    type: object
    additionalProperties:
      type: string
