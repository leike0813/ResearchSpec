title: 论文与专利双向技术比较 (Paper–Patent Comparison)
description: 比较给定论文与专利的技术异同，定位各自独有、改名和范围不同的特征，分列日期与证据限制。Use for a bilateral technical comparison of a paper and a patent.
maturity: operational
class: analysis
node_kind: producer
execution_type: llm
