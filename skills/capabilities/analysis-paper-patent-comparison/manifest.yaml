    schema_ref: paper-source.v1
    required: true
    source_policy: handoff
  - role: patent_source
    schema_ref: patent-source.v1
    required: true
    source_policy: handoff
outputs:
  - role: comparison_report
    schema_ref: paper-patent-comparison-report.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs: [paper_source, patent_source]
    outputs: []
    error_codes: [output_roles_invalid]
