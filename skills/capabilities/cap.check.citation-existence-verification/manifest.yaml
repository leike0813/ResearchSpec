schema_version: "1"
capability_id: cap.check.citation-existence-verification
title: Citation Existence Verification
description: Deterministic resolver-based citation existence gate.
class: verification
node_kind: checker
execution_type: script
params: {}
inputs:
  - role: annotated_bibliography
    schema_ref: annotated-bibliography.v1
    required: true
    source_policy: node_output
outputs:
  - role: citation_verification_report
    schema_ref: citation-existence.v1
    required: true
validators:
  - validator_id: capability.policy.output_roles
    kind: policy
    inputs:
      - annotated_bibliography
    outputs: []
    error_codes:
      - output_roles_invalid
  - validator_id: citation-verification-gate-script
    kind: script
    inputs:
      - annotated_bibliography
    outputs:
      - citation_verification_report
    error_codes:
      - script_validator_failed
    runner:
      argv0: python3
      args_template:
        - validators/citation-verification-gate.py
        - "{outputs_json}"
knowledge_refs: []
gate_policy: required
provenance:
  origin: ars-derived
  extraction_artifact_ids:
    - CAP-M5-11
  upstream_sources:
    - path: docs/ars_extraction/m5-side-branches/capabilities/11_citation_verification_gate.py
      sha256: a109e97f5d43872946e0c0ca03e3a11cac9e9153963ec575480f6b0a6bae502e
