<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ResearchSpec Skill Harness</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">ResearchSpec developer harness</p>
        <h1>Skill Browser</h1>
      </div>
      <button id="refresh" class="secondary" type="button">Reload sources</button>
    </header>
    <section id="health" class="health" aria-live="polite"></section>
    <main class="layout">
      <aside class="sidebar">
        <label>
          Search
          <input id="search" type="search" placeholder="Skill, domain, vendor…" autocomplete="off">
        </label>
        <label class="checkbox"><input id="show-empty" type="checkbox"> Show empty domains</label>
        <p id="navigation-count" class="muted"></p>
        <nav id="skill-navigation" class="skill-navigation" aria-label="Skill hierarchy"></nav>
      </aside>
      <article id="detail" class="detail">
        <div class="empty-state">
          <h2>Select a Skill</h2>
          <p>Browse the production-installable ARSU, Companion, and domain plugin projections.</p>
        </div>
      </article>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
